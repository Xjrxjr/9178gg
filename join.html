<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加入我们 · 人员录入</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0b0f2a 0%, #151b4b 40%, #3b1f5a 70%, #0e2a4a 100%);
    min-height: 100vh;
    padding: 24px 16px;
    color: #fff;
    position: relative;
    overflow-x: hidden;
  }
  /* 背景光晕 */
  body::before {
    content: '';
    position: fixed;
    top: -10%; left: -10%;
    width: 60%; height: 60%;
    background: radial-gradient(circle, rgba(25,118,210,0.25) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -10%; right: -10%;
    width: 55%; height: 55%;
    background: radial-gradient(circle, rgba(94,53,177,0.22) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header .badge {
    display: inline-block;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(10px);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #ffd700;
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 30px;
    font-weight: bold;
    background: linear-gradient(90deg, #fff 0%, #90caf9 50%, #ffd700 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  header p {
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    line-height: 1.6;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    border-radius: 18px;
    padding: 26px 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 13px;
    color: #b3d4ff;
    margin-bottom: 7px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .field label .req { color: #ff5252; margin-left: 2px; }
  .field label .hint { color: rgba(255,255,255,0.45); font-weight: normal; font-size: 11px; }
  .field input[type="text"],
  .field input[type="number"],
  .field select,
  .field textarea {
    width: 100%;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;
    padding: 12px 14px;
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    outline: none;
    border-color: #64b5f6;
    box-shadow: 0 0 0 3px rgba(100,181,246,0.18);
  }
  .field textarea { resize: vertical; min-height: 80px; }
  .field select option { background: #151b4b; color: #fff; }
  .qq-row { display: flex; gap: 8px; }
  .qq-row input { flex: 1; }
  .qq-row button {
    background: linear-gradient(135deg, #1976d2, #1565c0);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 14px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.15s;
  }
  .qq-row button:hover { transform: translateY(-1px); }
  .avatar-preview {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 10px;
    padding: 10px 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 10px;
  }
  .avatar-preview img {
    width: 64px; height: 64px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,215,0,0.4);
    background: #0b0f2a;
  }
  .avatar-preview .av-text { font-size: 12px; color: rgba(255,255,255,0.6); }
  .submit-row {
    margin-top: 8px;
    display: flex;
    gap: 10px;
  }
  .btn-submit {
    flex: 1;
    background: linear-gradient(135deg, #ffd700 0%, #ffb300 100%);
    color: #0b0f2a;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,215,0,0.3); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-reset {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-reset:hover { background: rgba(255,255,255,0.14); }
  .status {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
    white-space: pre-wrap;
  }
  .status.show { display: block; }
  .status.info  { background: rgba(25,118,210,0.18); border: 1px solid rgba(100,181,246,0.4); color: #bbdefb; }
  .status.ok    { background: rgba(46,125,50,0.20); border: 1px solid rgba(102,187,106,0.5); color: #c8e6c9; }
  .status.err   { background: rgba(211,47,47,0.18); border: 1px solid rgba(239,154,154,0.5); color: #ffcdd2; }
  .result-card {
    display: none;
    margin-top: 18px;
    padding: 16px;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(100,181,246,0.4);
    border-radius: 12px;
  }
  .result-card.show { display: block; }
  .result-card h3 { margin-bottom: 8px; color: #ffd700; font-size: 15px; }
  .result-card p { margin-bottom: 12px; color: rgba(255,255,255,0.68); font-size: 12px; line-height: 1.6; }
  .application-state {
    margin: 10px 0 12px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
  }
  .application-state.pending { background: rgba(25,118,210,0.22); color: #bbdefb; }
  .application-state.approved { background: rgba(46,125,50,0.24); color: #c8e6c9; }
  .application-state.rejected, .application-state.closed { background: rgba(198,40,40,0.22); color: #ffcdd2; }
  .application-state.offline { background: rgba(245,124,0,0.22); color: #ffe0b2; }
  .coach-choice {
    display: none;
    margin: 12px 0;
    padding: 14px;
    border: 1px solid rgba(255,215,0,0.42);
    border-radius: 8px;
    background: rgba(255,215,0,0.08);
  }
  .coach-choice.show { display: block; }
  .coach-choice h4 { margin: 0 0 6px; color: #ffd700; font-size: 14px; }
  .coach-choice p { margin: 0 0 10px; }
  .coach-choice-row { display: flex; gap: 8px; align-items: stretch; }
  .coach-choice select {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 8px;
    background: #151b4b;
    color: #fff;
    font: inherit;
  }
  .coach-choice button {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    background: #ffd700;
    color: #0b0f2a;
    font-weight: bold;
    cursor: pointer;
  }
  .coach-choice button:disabled { opacity: 0.6; cursor: not-allowed; }
  .coach-choice-status { min-height: 18px; margin-top: 8px; color: #c8e6c9; font-size: 12px; }
  .result-card label { display: block; margin: 10px 0 6px; color: #b3d4ff; font-size: 12px; }
  .result-card textarea {
    width: 100%;
    padding: 10px;
    resize: vertical;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    background: rgba(0,0,0,0.35);
    color: #fff;
    font: 12px Consolas, monospace;
  }
  .result-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .result-actions button {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: #1976d2;
    color: #fff;
    cursor: pointer;
  }
  .warn-banner {
    margin-bottom: 18px;
    padding: 12px 14px;
    background: rgba(255,152,0,0.15);
    border: 1px solid rgba(255,183,77,0.5);
    border-radius: 10px;
    font-size: 13px;
    color: #ffe0b2;
    line-height: 1.6;
    display: none;
  }
  .warn-banner.show { display: block; }
  .warn-banner b { color: #ffd700; }
  .warn-banner code { background: rgba(0,0,0,0.3); padding: 1px 5px; border-radius: 4px; color: #ffcc80; font-size: 12px; }
  footer {
    text-align: center;
    margin-top: 22px;
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    line-height: 1.6;
  }
  footer a { color: #90caf9; text-decoration: none; }
  @media (max-width: 520px) {
    header h1 { font-size: 24px; }
    .card { padding: 20px 16px; }
    .coach-choice-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">⚡ 加入我们</span>
    <h1>填写你的入队信息</h1>
    <p>提交后将由管理员审批，通过后你的名片会展示在团队主页，并显示欢迎横幅。</p>
  </header>

  <div class="warn-banner" id="warnBanner">
    ⚠️ <b>提交通道尚未配置</b>：管理员请先部署 <code>join-worker.js</code>，再打开
    <code>admin.html</code>，在「异地提交通道配置」中填写 Worker URL。
  </div>

  <div class="card">
    <div class="field">
      <label>姓名 / 游戏ID <span class="req">*</span></label>
      <input type="text" id="name" placeholder="例：张三" maxlength="30">
    </div>

    <div class="field">
      <label>所属团队 <span class="req">*</span></label>
      <select id="team"><option value="">加载中…</option></select>
    </div>

    <div class="field">
      <label>QQ号 <span class="hint">（用作头像来源；不填则无个人头像）</span></label>
      <div class="qq-row">
        <input type="text" id="qq" placeholder="纯数字QQ号" inputmode="numeric" pattern="[0-9]*" maxlength="15">
        <button type="button" id="useQQBtn">🐧 预览头像</button>
      </div>
      <div class="avatar-preview" id="avatarPreview" style="display:none;">
        <img id="avatarImg" src="" alt="头像预览">
        <div class="av-text" id="avatarText"></div>
      </div>
    </div>

    <div class="field">
      <label>身份 / 警号 <span class="hint">（例：警员-警号2010 / 队员 / 副手）</span></label>
      <input type="text" id="desc" placeholder="例：警员-警号2010" maxlength="40">
    </div>

    <div class="field">
      <label>个人简介 <span class="hint">（选填，会在详情页展示）</span></label>
      <textarea id="bio" placeholder="一句话介绍自己，多行也行" maxlength="200"></textarea>
    </div>

    <div class="submit-row">
      <button class="btn-submit" id="submitBtn" type="button">🚀 提交申请</button>
      <button class="btn-reset" id="resetBtn" type="button">清空</button>
    </div>

    <div class="status" id="status"></div>

    <div class="result-card" id="resultCard">
      <h3 id="resultTitle">申请信息</h3>
      <p id="resultDesc"></p>
      <div class="application-state pending" id="applicationState"></div>
      <div class="coach-choice" id="coachChoice">
        <h4>选择你的教练</h4>
        <p id="coachChoiceHint">请选择所属团队当前开放的教练。</p>
        <div class="coach-choice-row">
          <select id="coachSelect" aria-label="选择教练"></select>
          <button id="saveCoachBtn" type="button">保存选择</button>
        </div>
        <div class="coach-choice-status" id="coachChoiceStatus"></div>
      </div>
      <div class="result-actions">
        <button id="refreshStatusBtn" type="button">刷新审批状态</button>
      </div>
      <label for="resultLink">申请链接</label>
      <textarea id="resultLink" readonly rows="2"></textarea>
      <div class="result-actions">
        <button id="copyLinkBtn" type="button">复制链接</button>
        <button id="shareLinkBtn" type="button">再次复制</button>
      </div>
      <label for="resultCode">备用申请码</label>
      <textarea id="resultCode" readonly rows="3"></textarea>
      <div class="result-actions">
        <button id="copyCodeBtn" type="button">复制申请码</button>
      </div>
    </div>
  </div>

  <footer>
    提交即代表同意管理员展示你的信息。<br>
    本表单通过 GitHub Issue 提交，<b>员工异地即可直接提交</b>（无需登录 GitHub）。有问题联系管理员。
  </footer>
</div>

<script>
// 该公开地址由 admin.html 的「部署异地提交通道」功能写入。
// GitHub PAT 只能保存在 Worker 的 GITHUB_PAT Secret 中，严禁写入本文件。
var JOIN_API_URL = "https://9178gg-join.3751211611.workers.dev";
var JOIN_HISTORY_KEY = 'join_application_history_v1';
var currentApplication = null;
var availableTeams = [];

// ===== 工具 =====
function $(id){ return document.getElementById(id); }
function showStatus(type, msg){
  var el = $('status');
  el.className = 'status show ' + type;
  el.textContent = msg;
}
function getImgSrc(src){
  if (!src) return '';
  if (src.indexOf('qq:') === 0) {
    var qq = src.substring(3);
    return 'https://q1.qlogo.cn/g?b=qq&nk=' + encodeURIComponent(qq) + '&s=640&t=' + Date.now();
  }
  return src;
}
// UTF-8 → Base64（含中文安全）
function u8ToB64(str){
  try { return btoa(unescape(encodeURIComponent(str))); } catch(e){ return ''; }
}
// Base64 → UTF-8（admin 端共用时使用）
function b64ToU8(b64){
  try { return decodeURIComponent(escape(atob(b64))); } catch(e){ return ''; }
}
// URL 安全 base64（申请链接用）
function toUrlSafe(b64){ return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function fromUrlSafe(s){
  s = String(s||'').replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  return s;
}
// 编码申请："V1:" + urlSafeB64(JSON)
function encodeJoinPayload(data){
  return 'V1:' + toUrlSafe(u8ToB64(JSON.stringify(data)));
}
// 解码申请（admin 端会调用）
function decodeJoinPayload(code){
  if (!code) return null;
  var s = String(code).trim();
  if (s.indexOf('V1:') !== 0) {
    // 兼容：裸 base64
    try { return JSON.parse(b64ToU8(fromUrlSafe(s))); } catch(e){ return null; }
  }
  s = s.substring(3);
  try { return JSON.parse(b64ToU8(fromUrlSafe(s))); } catch(e){ return null; }
}

// 猜测 admin.html 的绝对路径：把当前 URL 的 join.html 替换成 admin.html
function guessAdminUrl(){
  try {
    var u = new URL(location.href);
    u.search = ''; u.hash = '';
    u.pathname = u.pathname.replace(/[^/]*$/, '') + 'admin.html';
    return u.toString();
  } catch(e){
    // file:// 环境不支持 URL 构造，退化成相对路径提示
    return '（后台请打开 admin.html 并在「导入申请码」处粘贴下面的申请码）';
  }
}

function explainIssueError(status){
  if (status === 401) return 'Worker 中的 GitHub PAT 无效或已过期，请联系管理员。';
  if (status === 403) return 'Worker 拒绝了当前网站来源，或 GitHub PAT 权限不足。';
  if (status === 404) return 'Worker 地址或目标仓库不存在。';
  if (status === 503) return 'Worker 尚未配置 GITHUB_PAT Secret。';
  return '异地提交服务返回 HTTP ' + status + '。';
}

function postJson(url, data){
  var body = JSON.stringify(data);
  if (window.fetch) {
    // text/plain 属于 CORS 简单请求，可避开部分手机内置浏览器拦截 OPTIONS 预检。
    var controller = window.AbortController ? new AbortController() : null;
    return new Promise(function(resolve, reject){
      var timer = setTimeout(function(){
        if (controller) controller.abort();
        reject(new Error('连接异地提交服务超时，请切换网络后重试。'));
      }, 15000);
      var options = {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=UTF-8'},
        body: body,
        credentials: 'omit',
        cache: 'no-store'
      };
      if (controller) options.signal = controller.signal;
      fetch(url, options).then(function(response){
        clearTimeout(timer);
        resolve(response);
      }, function(error){
        clearTimeout(timer);
        if (error && error.name === 'AbortError') {
          reject(new Error('连接异地提交服务超时，请切换网络后重试。'));
          return;
        }
        reject(error);
      });
    });
  }
  return new Promise(function(resolve, reject){
    var xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.setRequestHeader('Content-Type', 'text/plain;charset=UTF-8');
    xhr.timeout = 15000;
    xhr.onload = function(){
      resolve({
        ok: xhr.status >= 200 && xhr.status < 300,
        status: xhr.status,
        json: function(){
          try { return Promise.resolve(JSON.parse(xhr.responseText || '{}')); }
          catch(e) { return Promise.resolve({}); }
        }
      });
    };
    xhr.onerror = function(){ reject(new Error('手机网络无法连接异地提交服务。')); };
    xhr.ontimeout = function(){ reject(new Error('连接异地提交服务超时，请切换网络后重试。')); };
    xhr.send(body);
  });
}

async function submitToGitHubIssue(data){
  var response = await postJson(JOIN_API_URL, data);
  if (!response.ok) {
    var detail = '';
    try {
      var errorData = await response.json();
      var errorMessage = errorData && (errorData.error || errorData.message);
      detail = errorMessage ? '（' + errorMessage + '）' : '';
    } catch(e){}
    throw new Error(explainIssueError(response.status) + detail);
  }
  return response.json();
}

function readApplicationHistory(){
  try {
    var value = JSON.parse(localStorage.getItem(JOIN_HISTORY_KEY) || '[]');
    return Array.isArray(value) ? value : [];
  } catch(e) {
    return [];
  }
}

function saveApplication(record){
  if (!record) return;
  var list = readApplicationHistory().filter(function(item){
    if (record.issueNumber && item.issueNumber) {
      return String(item.issueNumber) !== String(record.issueNumber);
    }
    return item.savedId !== record.savedId;
  });
  list.unshift(record);
  try { localStorage.setItem(JOIN_HISTORY_KEY, JSON.stringify(list.slice(0, 10))); } catch(e){}
  currentApplication = record;
}

function applicationMessage(state){
  if (state === 'approved') {
    return {
      title: '申请已通过',
      desc: '管理员已通过申请，人员资料已经部署到主站。',
      status: '✅ 你的入队申请已通过。'
    };
  }
  if (state === 'rejected') {
    return {
      title: '申请未通过',
      desc: '管理员已处理该申请。如有疑问，请联系管理员。',
      status: '❌ 你的入队申请未通过。'
    };
  }
  if (state === 'closed') {
    return {
      title: '申请已关闭',
      desc: '申请已被管理员关闭，但没有识别到明确的审批结果，请联系管理员。',
      status: '申请已关闭，请联系管理员确认结果。'
    };
  }
  if (state === 'offline') {
    return {
      title: '备用申请码待导入',
      desc: '远程提交未成功，请把下面的申请链接或申请码发给管理员。',
      status: '尚未进入远程审批，请联系管理员导入申请码。'
    };
  }
  return {
    title: '申请已提交，等待管理员审批',
    desc: '申请记录已保存在本机。刷新本页面后仍可查询审批结果。',
    status: '正在等待管理员审批。'
  };
}

function applicationTeamId(record){
  var direct = Number(record && record.team);
  if (Number.isInteger(direct) && direct > 0) return direct;
  var payload = decodeJoinPayload(record && record.code);
  var fromCode = Number(payload && payload.team);
  return Number.isInteger(fromCode) && fromCode > 0 ? fromCode : 0;
}

function renderCoachChoice(record){
  var box = $('coachChoice');
  var select = $('coachSelect');
  var button = $('saveCoachBtn');
  var hint = $('coachChoiceHint');
  var status = $('coachChoiceStatus');
  if (!box || !select || !button || !hint || !status) return;
  if (!record || record.state !== 'approved') {
    box.classList.remove('show');
    return;
  }

  box.classList.add('show');
  var teamId = applicationTeamId(record);
  var team = availableTeams.find(function(item){ return Number(item && item.id) === teamId; });
  if (!team) {
    select.innerHTML = '<option value="">正在读取所属团队教练…</option>';
    select.disabled = true;
    button.disabled = true;
    hint.textContent = teamId ? '正在读取教练列表，请稍候。' : '正在读取申请所属团队，请点“刷新审批状态”。';
    status.textContent = '';
    return;
  }

  var choices = (Array.isArray(team.coaches) ? team.coaches : [])
    .map(function(coach, index){ return { coach: coach, index: index }; })
    .filter(function(item){
      return item.coach && item.coach.enabled === true && String(item.coach.name || '').trim();
    });
  hint.textContent = '已通过「' + String(team.name || record.teamName || '') + '」申请，可选择该团队教练。';
  if (!choices.length) {
    select.innerHTML = '<option value="">该团队暂无开放教练</option>';
    select.disabled = true;
    button.disabled = true;
    status.textContent = '管理员尚未为该团队开放教练。';
    return;
  }

  select.innerHTML = '<option value="">请选择教练</option>' + choices.map(function(item){
    return '<option value="' + item.index + '">' +
      String(item.coach.name).replace(/[&<>"']/g, function(character){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character];
      }) + '</option>';
  }).join('');
  select.disabled = false;
  button.disabled = false;
  var choice = record.coachChoice;
  if (choice && Number(choice.team) === teamId) {
    var matched = choices.find(function(item){
      return item.index === Number(choice.index) && String(item.coach.name).trim() === String(choice.name || '').trim();
    });
    if (matched) select.value = String(matched.index);
    status.textContent = '当前已选择：' + String(choice.name || '');
    button.textContent = '更新选择';
  } else {
    status.textContent = '';
    button.textContent = '保存选择';
  }
}

function renderApplication(record, announce){
  if (!record) return;
  currentApplication = record;
  var message = applicationMessage(record.state || 'pending');
  $('resultTitle').textContent = message.title;
  $('resultDesc').textContent = message.desc;
  $('resultLink').value = record.issueUrl || record.link || '';
  $('resultCode').value = record.code || '';
  $('applicationState').className = 'application-state ' + (record.state || 'pending');
  $('applicationState').textContent = message.status;
  $('refreshStatusBtn').style.display =
    record.issueNumber && record.trackingId && JOIN_API_URL ? '' : 'none';
  $('resultCard').classList.add('show');
  renderCoachChoice(record);
  if (announce) {
    showStatus(record.state === 'approved' ? 'ok' :
      ((record.state === 'rejected' || record.state === 'closed') ? 'err' : 'info'),
      message.status
    );
  }
}

async function refreshApplicationStatus(manual){
  var record = currentApplication;
  if (!record || !record.issueNumber || !record.trackingId || !JOIN_API_URL) return;
  var btn = $('refreshStatusBtn');
  if (btn) { btn.disabled = true; btn.textContent = '查询中…'; }
  try {
    var query = '?issue=' + encodeURIComponent(record.issueNumber) +
      '&tracking=' + encodeURIComponent(record.trackingId);
    var response = await fetch(JOIN_API_URL.replace(/\/+$/, '') + '/status' + query, {
      cache: 'no-store'
    });
    var result = await response.json().catch(function(){ return {}; });
    if (!response.ok) throw new Error(result.error || ('HTTP ' + response.status));
    var previousState = record.state;
    record.state = result.status || 'pending';
    record.personId = result.person_id || '';
    record.team = Number(result.team) || applicationTeamId(record) || null;
    record.teamName = result.team_name || record.teamName || '';
    record.coachChoice = result.coach_choice || null;
    record.updatedAt = result.updated_at || new Date().toISOString();
    saveApplication(record);
    renderApplication(record, manual || previousState !== record.state);
  } catch(e) {
    if (manual) showStatus('err', '审批状态查询失败：' + (e && e.message || e));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '刷新审批状态'; }
  }
}

async function saveCoachSelection(){
  var record = currentApplication;
  var select = $('coachSelect');
  var button = $('saveCoachBtn');
  var status = $('coachChoiceStatus');
  if (!record || record.state !== 'approved' || !select || !select.value) {
    if (status) status.textContent = '请先选择一位教练。';
    return;
  }
  var teamId = applicationTeamId(record);
  var team = availableTeams.find(function(item){ return Number(item && item.id) === teamId; });
  var coachIndex = Number(select.value);
  var coach = team && Array.isArray(team.coaches) ? team.coaches[coachIndex] : null;
  if (!coach || coach.enabled !== true) {
    status.textContent = '该教练已不可选，请刷新页面。';
    return;
  }

  button.disabled = true;
  button.textContent = '保存中…';
  status.textContent = '';
  try {
    var response = await postJson(JOIN_API_URL.replace(/\/+$/, '') + '/coach', {
      issue: record.issueNumber,
      tracking: record.trackingId,
      coach_index: coachIndex,
      coach_name: String(coach.name || '').trim()
    });
    var result = await response.json().catch(function(){ return {}; });
    if (!response.ok) throw new Error(result.error || ('HTTP ' + response.status));
    record.coachChoice = result.coach_choice || null;
    record.updatedAt = result.updated_at || new Date().toISOString();
    saveApplication(record);
    renderCoachChoice(record);
    showStatus('ok', '✅ 教练选择已保存，管理员可在申请详情中查看。');
  } catch(e) {
    status.textContent = '保存失败：' + (e && e.message || e);
    button.disabled = false;
    button.textContent = record.coachChoice ? '更新选择' : '保存选择';
  }
}

function restoreLatestApplication(){
  var list = readApplicationHistory();
  if (!list.length) return;
  renderApplication(list[0], true);
  refreshApplicationStatus(false);
}

// ===== 加载团队列表（读公开 teams.json，无需 token） =====
function loadTeams(){
  var sel = $('team');
  sel.innerHTML = '<option value="">加载中…</option>';
  var url = 'teams.json?t=' + Date.now();
  fetch(url, { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error(''+r.status); return r.json(); })
    .then(function(arr){
      sel.innerHTML = '';
      availableTeams = Array.isArray(arr) ? arr : [];
      var list = (arr || []).filter(function(t){
        // 只显示「启用 + 开放申请（joinOpen !== false）」的团队；
        // 后台把某团队开关关掉（不招人）后，这里就不会出现该团队
        return t && t.enabled === true && t.joinOpen !== false && t.name && String(t.name).trim() !== '';
      });
      if (!list.length) {
        sel.innerHTML = '<option value="">（暂无开放申请的团队，请联系管理员）</option>';
        return;
      }
      list.forEach(function(t){
        var opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = (t.icon || '') + ' ' + t.name;
        sel.appendChild(opt);
      });
      renderCoachChoice(currentApplication);
    })
    .catch(function(){
      availableTeams = [];
      sel.innerHTML = '<option value="">（团队加载失败）</option>';
      renderCoachChoice(currentApplication);
    });
}

// ===== 头像预览 =====
function refreshAvatarPreview(){
  var qq = $('qq').value.trim();
  var img = $('avatarImg');
  var box = $('avatarPreview');
  var txt = $('avatarText');
  if (qq && /^\d+$/.test(qq)) {
    img.src = 'https://q1.qlogo.cn/g?b=qq&nk=' + encodeURIComponent(qq) + '&s=640&t=' + Date.now();
    img.onerror = function(){ img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="%230b0f2a"/><text x="32" y="38" font-size="28" text-anchor="middle">👤</text></svg>'; };
    txt.textContent = '将用 QQ(' + qq + ') 的实时头像';
    box.style.display = 'flex';
  } else {
    img.src = '';
    box.style.display = 'none';
  }
}

// ===== 远程提交；失败时自动生成申请码兜底 =====
async function submit(){
  var name = $('name').value.trim();
  var teamVal = $('team').value;
  var selectedTeam = $('team').options[$('team').selectedIndex];
  var teamName = selectedTeam
    ? selectedTeam.textContent.replace(/^[^\w\u4e00-\u9fa5]+/, '').trim()
    : '';
  var qq = $('qq').value.trim();
  var desc = $('desc').value.trim();
  var bio = $('bio').value.trim();

  if (!name) { showStatus('err', '❌ 请填写姓名'); $('name').focus(); return; }
  if (!teamVal) { showStatus('err', '❌ 请选择所属团队'); $('team').focus(); return; }
  if (qq && !/^\d+$/.test(qq)) { showStatus('err', '❌ QQ号只能是纯数字'); $('qq').focus(); return; }

  var data = {
    name: name,
    team: +teamVal,
    teamName: teamName,
    qq: qq,
    image: qq ? ('qq:' + qq) : '',
    desc: desc,
    bio: bio,
    submittedAt: new Date().toISOString()
  };

  var btn = $('submitBtn');
  btn.disabled = true;
  btn.textContent = JOIN_API_URL ? '提交中…' : '生成中…';

  if (JOIN_API_URL) {
    try {
      var issue = await submitToGitHubIssue(data);
      var remoteRecord = {
        savedId: 'issue_' + issue.number,
        issueNumber: issue.number,
        issueUrl: issue.html_url || '',
        trackingId: issue.tracking_id || '',
        code: encodeJoinPayload(data),
        name: data.name,
        team: data.team,
        teamName: data.teamName,
        submittedAt: data.submittedAt,
        state: 'pending'
      };
      saveApplication(remoteRecord);
      renderApplication(remoteRecord, false);
      showStatus('ok',
        '✅ 申请已远程提交成功。\n' +
        '管理员审批通过后，你的名片会出现在「' + teamName + '」团队主页。'
      );
      btn.disabled = false;
      btn.textContent = '✅ 已提交';
      return;
    } catch(e) {
      showStatus('err',
        '⚠️ 远程提交失败：' + (e && e.message || e) + '\n' +
        '已自动生成备用申请码，请把下面的链接或申请码发给管理员。'
      );
    }
  }

  var code = encodeJoinPayload(data);
  var adminUrl = guessAdminUrl();
  var link = (adminUrl.indexOf('http') === 0)
    ? adminUrl + '?join=' + encodeURIComponent(code)
    : adminUrl;

  var offlineRecord = {
    savedId: 'offline_' + Date.now(),
    code: code,
    link: link,
    name: data.name,
    team: data.team,
    teamName: data.teamName,
    submittedAt: data.submittedAt,
    state: 'offline'
  };
  saveApplication(offlineRecord);
  renderApplication(offlineRecord, false);
  if (!JOIN_API_URL) {
    showStatus('info', '已生成备用申请码，请把下面的申请链接或申请码发给管理员。');
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
  btn.disabled = false;
  btn.textContent = '🔄 重新生成申请';
}

function copyToClip(text, okMsg){
  var done = false, errMsg = '';
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ done = true; }, function(e){ errMsg = e && e.message || 'clipboard fail'; });
    }
  } catch(e){ errMsg = String(e); }
  setTimeout(function(){
    if (done) {
      showStatus('ok', okMsg || '✅ 已复制到剪贴板');
      return;
    }
    // 兼容回退：用 textarea.select + execCommand
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      showStatus(ok ? 'ok' : 'err', ok
        ? (okMsg || '✅ 已复制到剪贴板')
        : '⚠️ 自动复制失败，请手动选中并 Ctrl+C 复制。' + (errMsg ? '（'+errMsg+'）' : '')
      );
    } catch(e){
      showStatus('err', '⚠️ 自动复制失败，请手动选中并 Ctrl+C 复制。');
    }
  }, done ? 0 : 500);
}

// ===== 绑定 =====
$('useQQBtn').onclick = refreshAvatarPreview;
$('qq').addEventListener('input', function(){
  if ($('avatarPreview').style.display !== 'none') refreshAvatarPreview();
});
$('submitBtn').onclick = submit;
$('resetBtn').onclick = function(){
  ['name','qq','desc','bio'].forEach(function(id){ $(id).value = ''; });
  $('team').selectedIndex = 0;
  refreshAvatarPreview();
  $('status').className = 'status';
  $('status').textContent = '';
  if (!currentApplication) {
    $('resultCard').classList.remove('show');
    $('resultCode').value = '';
    $('resultLink').value = '';
  }
  $('submitBtn').textContent = JOIN_API_URL ? '🚀 提交申请' : '🚀 生成申请码';
};
$('refreshStatusBtn').onclick = function(){ refreshApplicationStatus(true); };
$('saveCoachBtn').onclick = saveCoachSelection;
$('copyLinkBtn').onclick = function(){ copyToClip($('resultLink').value, '✅ 申请链接已复制，直接发给管理员点一下就能在后台导入审批。'); };
$('copyCodeBtn').onclick = function(){ copyToClip($('resultCode').value, '✅ 申请码已复制，发给管理员让他在后台「导入申请码」粘贴即可。'); };
$('shareLinkBtn').onclick = function(){ copyToClip($('resultLink').value, '✅ 申请链接已复制，粘贴发给管理员即可。'); };

// 初始化
loadTeams();
restoreLatestApplication();
setInterval(function(){
  if (!document.hidden) refreshApplicationStatus(false);
}, 60000);
if (!JOIN_API_URL) {
  $('warnBanner').classList.add('show');
  $('submitBtn').textContent = '🚀 生成申请码（通道未配置）';
}
// 暴露编解码函数，方便 admin 端直接导入
window.__decodeJoinPayload = decodeJoinPayload;
window.__encodeJoinPayload = encodeJoinPayload;
</script>
