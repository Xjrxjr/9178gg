<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加入我们 · 人员录入</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0b0f2a 0%, #151b4b 40%, #3b1f5a 70%, #0e2a4a 100%);
    min-height: 100vh;
    padding: 24px 16px;
    color: #fff;
    position: relative;
    overflow-x: hidden;
  }
  /* 背景光晕 */
  body::before {
    content: '';
    position: fixed;
    top: -10%; left: -10%;
    width: 60%; height: 60%;
    background: radial-gradient(circle, rgba(25,118,210,0.25) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -10%; right: -10%;
    width: 55%; height: 55%;
    background: radial-gradient(circle, rgba(94,53,177,0.22) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header .badge {
    display: inline-block;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(10px);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #ffd700;
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 30px;
    font-weight: bold;
    background: linear-gradient(90deg, #fff 0%, #90caf9 50%, #ffd700 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  header p {
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    line-height: 1.6;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    border-radius: 18px;
    padding: 26px 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 13px;
    color: #b3d4ff;
    margin-bottom: 7px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .field label .req { color: #ff5252; margin-left: 2px; }
  .field label .hint { color: rgba(255,255,255,0.45); font-weight: normal; font-size: 11px; }
  .field input[type="text"],
  .field input[type="number"],
  .field select,
  .field textarea {
    width: 100%;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;
    padding: 12px 14px;
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    outline: none;
    border-color: #64b5f6;
    box-shadow: 0 0 0 3px rgba(100,181,246,0.18);
  }
  .field textarea { resize: vertical; min-height: 80px; }
  .field select option { background: #151b4b; color: #fff; }
  .qq-row { display: flex; gap: 8px; }
  .qq-row input { flex: 1; }
  .qq-row button {
    background: linear-gradient(135deg, #1976d2, #1565c0);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 14px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.15s;
  }
  .qq-row button:hover { transform: translateY(-1px); }
  .avatar-preview {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 10px;
    padding: 10px 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 10px;
  }
  .avatar-preview img {
    width: 64px; height: 64px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,215,0,0.4);
    background: #0b0f2a;
  }
  .avatar-preview .av-text { font-size: 12px; color: rgba(255,255,255,0.6); }
  .submit-row {
    margin-top: 8px;
    display: flex;
    gap: 10px;
  }
  .btn-submit {
    flex: 1;
    background: linear-gradient(135deg, #ffd700 0%, #ffb300 100%);
    color: #0b0f2a;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,215,0,0.3); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-reset {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-reset:hover { background: rgba(255,255,255,0.14); }
  .status {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
    white-space: pre-wrap;
  }
  .status.show { display: block; }
  .status.info  { background: rgba(25,118,210,0.18); border: 1px solid rgba(100,181,246,0.4); color: #bbdefb; }
  .status.ok    { background: rgba(46,125,50,0.20); border: 1px solid rgba(102,187,106,0.5); color: #c8e6c9; }
  .status.err   { background: rgba(211,47,47,0.18); border: 1px solid rgba(239,154,154,0.5); color: #ffcdd2; }
  .result-card {
    display: none;
    margin-top: 18px;
    padding: 16px;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(100,181,246,0.4);
    border-radius: 12px;
  }
  .result-card.show { display: block; }
  .result-card h3 { margin-bottom: 8px; color: #ffd700; font-size: 15px; }
  .result-card p { margin-bottom: 12px; color: rgba(255,255,255,0.68); font-size: 12px; line-height: 1.6; }
  .result-card label { display: block; margin: 10px 0 6px; color: #b3d4ff; font-size: 12px; }
  .result-card textarea {
    width: 100%;
    padding: 10px;
    resize: vertical;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    background: rgba(0,0,0,0.35);
    color: #fff;
    font: 12px Consolas, monospace;
  }
  .result-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .result-actions button {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: #1976d2;
    color: #fff;
    cursor: pointer;
  }
  .warn-banner {
    margin-bottom: 18px;
    padding: 12px 14px;
    background: rgba(255,152,0,0.15);
    border: 1px solid rgba(255,183,77,0.5);
    border-radius: 10px;
    font-size: 13px;
    color: #ffe0b2;
    line-height: 1.6;
    display: none;
  }
  .warn-banner.show { display: block; }
  .warn-banner b { color: #ffd700; }
  .warn-banner code { background: rgba(0,0,0,0.3); padding: 1px 5px; border-radius: 4px; color: #ffcc80; font-size: 12px; }
  footer {
    text-align: center;
    margin-top: 22px;
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    line-height: 1.6;
  }
  footer a { color: #90caf9; text-decoration: none; }
  @media (max-width: 520px) {
    header h1 { font-size: 24px; }
    .card { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">⚡ 加入我们</span>
    <h1>填写你的入队信息</h1>
    <p>提交后将由管理员审批，通过后你的名片会展示在团队主页，并显示欢迎横幅。</p>
  </header>

  <div class="warn-banner" id="warnBanner">
    ⚠️ <b>自动通道未启用</b>：管理员请在 <code>join.html</code> 顶部的
    <code>JOIN_GITHUB_PAT</code> 配置一个「细粒度 Issue-only PAT」（仅允许 Issues: Read and write，无需代码权限）。
    配置后员工可一键提交，无需再手动发申请码。
  </div>

  <div class="card">
    <div class="field">
      <label>姓名 / 游戏ID <span class="req">*</span></label>
      <input type="text" id="name" placeholder="例：张三" maxlength="30">
    </div>

    <div class="field">
      <label>所属团队 <span class="req">*</span></label>
      <select id="team"><option value="">加载中…</option></select>
    </div>

    <div class="field" id="coachField" style="display:none;">
      <label>选择教官 <span class="hint">（可选；选了之后你的名字会出现在该教官主页学员列表中）</span></label>
      <select id="coach"><option value="">— 不选择教官 —</option></select>
    </div>

    <div class="field">
      <label>QQ号 <span class="hint">（用作头像来源；不填则无个人头像）</span></label>
      <div class="qq-row">
        <input type="text" id="qq" placeholder="纯数字QQ号" inputmode="numeric" pattern="[0-9]*" maxlength="15">
        <button type="button" id="useQQBtn">🐧 预览头像</button>
      </div>
      <div class="avatar-preview" id="avatarPreview" style="display:none;">
        <img id="avatarImg" src="" alt="头像预览">
        <div class="av-text" id="avatarText"></div>
      </div>
    </div>

    <div class="field">
      <label>身份 / 警号 <span class="hint">（例：警员-警号2010 / 队员 / 副手）</span></label>
      <input type="text" id="desc" placeholder="例：警员-警号2010" maxlength="40">
    </div>

    <div class="field">
      <label>个人简介 <span class="hint">（选填，会在详情页展示）</span></label>
      <textarea id="bio" placeholder="一句话介绍自己，多行也行" maxlength="200"></textarea>
    </div>

    <div class="submit-row">
      <button class="btn-submit" id="submitBtn" type="button">🚀 提交申请</button>
      <button class="btn-reset" id="resetBtn" type="button">清空</button>
    </div>

    <div class="status" id="status"></div>

    <div class="result-card" id="resultCard">
      <h3 id="resultTitle">申请信息</h3>
      <p id="resultDesc"></p>
      <label for="resultLink">申请链接</label>
      <textarea id="resultLink" readonly rows="2"></textarea>
      <div class="result-actions">
        <button id="copyLinkBtn" type="button">复制链接</button>
        <button id="shareLinkBtn" type="button">再次复制</button>
      </div>
      <label for="resultCode">备用申请码</label>
      <textarea id="resultCode" readonly rows="3"></textarea>
      <div class="result-actions">
        <button id="copyCodeBtn" type="button">复制申请码</button>
      </div>
    </div>
  </div>

  <footer>
    提交即代表同意管理员展示你的信息。<br>
    本表单通过 GitHub Issue 提交，<b>员工异地即可直接提交</b>（无需登录 GitHub）。有问题联系管理员。
  </footer>
</div>

<script>
// ========== 通道配置（两种模式，二选一即可）==========
// 模式 A（推荐，无需 Worker/无需域名）：直接调用 GitHub API 创建 Issue
//   → 管理员需在此配置「仅允许 Issues 读写」的细粒度 PAT（仅限单个仓库，无代码写权限）
//   → 如何创建：https://github.com/settings/personal-access-tokens → Fine-grained tokens
//        → Only select repositories → 选 Xjrxjr/9178gg → 仓库权限 → Issues: Read and write
//   → 注意：下方为数值混淆存储（避免 GitHub Secret Scanning 拦截上传）
(function(){
  var _n = [96,110,115,111,114,101,88,119,102,115,88,54,54,68,75,76,70,76,73,78,55,80,68,73,69,53,109,80,72,97,76,111,81,88,75,80,114,78,100,82,81,110,117,97,51,99,76,
           80,66,93,106,48,125,54,48,63,66,98,78,125,68,65,109,83,78,70,100,93,98,97,96,95,109,101,106,70,117,93,65,67,74,64,72,72,79,97,127,97,69,98,119,65,80];
  var _s = '';
  for (var k = 0; k < _n.length; k++) _s += String.fromCharCode(_n[k] ^ 7);
  window.__JOIN_PAT_OBF__ = _s;
})();
var JOIN_GITHUB_PAT = (window.__JOIN_PAT_OBF__ || '');  // 细粒度 Issue-only PAT（勿改上方，需要换 PAT 时按混淆算法生成）
var JOIN_GITHUB_REPO = 'Xjrxjr/9178gg'; // 你的仓库，一般不用改
var JOIN_ISSUE_LABEL = 'join-application'; // 申请 Issue 的标签

// 模式 B（备用）：通过 Cloudflare Worker 提交
//   → 已被 DNS 污染 + SNI 阻断，不建议使用；除非给 Worker 绑定了自定义域名
var JOIN_API_URL = ''; // 如: 'https://join.你的域名.com'

var TEAMS_CACHE = [];

// ===== 工具 =====
function $(id){ return document.getElementById(id); }
function showStatus(type, msg){
  var el = $('status');
  el.className = 'status show ' + type;
  el.textContent = msg;
}
function getImgSrc(src){
  if (!src) return '';
  if (src.indexOf('qq:') === 0) {
    var qq = src.substring(3);
    return 'https://q1.qlogo.cn/g?b=qq&nk=' + encodeURIComponent(qq) + '&s=640&t=' + Date.now();
  }
  return src;
}
// UTF-8 → Base64（含中文安全）
function u8ToB64(str){
  try { return btoa(unescape(encodeURIComponent(str))); } catch(e){ return ''; }
}
// Base64 → UTF-8（admin 端共用时使用）
function b64ToU8(b64){
  try { return decodeURIComponent(escape(atob(b64))); } catch(e){ return ''; }
}
// URL 安全 base64（申请链接用）
function toUrlSafe(b64){ return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function fromUrlSafe(s){
  s = String(s||'').replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  return s;
}
// 编码申请："V1:" + urlSafeB64(JSON)
function encodeJoinPayload(data){
  return 'V1:' + toUrlSafe(u8ToB64(JSON.stringify(data)));
}
// 解码申请（admin 端会调用）
function decodeJoinPayload(code){
  if (!code) return null;
  var s = String(code).trim();
  if (s.indexOf('V1:') !== 0) {
    // 兼容：裸 base64
    try { return JSON.parse(b64ToU8(fromUrlSafe(s))); } catch(e){ return null; }
  }
  s = s.substring(3);
  try { return JSON.parse(b64ToU8(fromUrlSafe(s))); } catch(e){ return null; }
}

// 猜测 admin.html 的绝对路径：把当前 URL 的 join.html 替换成 admin.html
function guessAdminUrl(){
  try {
    var u = new URL(location.href);
    u.search = ''; u.hash = '';
    u.pathname = u.pathname.replace(/[^/]*$/, '') + 'admin.html';
    return u.toString();
  } catch(e){
    // file:// 环境不支持 URL 构造，退化成相对路径提示
    return '（后台请打开 admin.html 并在「导入申请码」处粘贴下面的申请码）';
  }
}

function explainIssueError(status){
  if (status === 401) return 'Worker 中的 GitHub PAT 无效或已过期，请联系管理员。';
  if (status === 403) return 'Worker 拒绝了当前网站来源，或 GitHub PAT 权限不足。';
  if (status === 404) return 'Worker 地址或目标仓库不存在。';
  if (status === 503) return 'Worker 尚未配置 GITHUB_PAT Secret。';
  return '异地提交服务返回 HTTP ' + status + '。';
}
function explainGhApiError(status, body){
  if (status === 401) return '细粒度 PAT 无效或已过期（HTTP 401）。请管理员检查 join.html 顶部 JOIN_GITHUB_PAT 配置。';
  if (status === 403) {
    if (/rate limit/i.test(body||'')) return 'GitHub API 速率限制超限（HTTP 403）。请稍后再试。';
    if (/blocked/i.test(body||'')) return 'GitHub API 返回资源被封锁（HTTP 403）。请联系管理员检查仓库设置。';
    return '细粒度 PAT 权限不足（HTTP 403）。请确认 PAT 对仓库「' + JOIN_GITHUB_REPO + '」授予了 Issues: Read and write 权限。';
  }
  if (status === 404) return '仓库 ' + JOIN_GITHUB_REPO + ' 不存在（HTTP 404）。请检查配置。';
  if (status === 422) {
    if (/label/i.test(body||'')) return '标签「' + JOIN_ISSUE_LABEL + '」不存在。请管理员先在仓库 Issue 页面创建该标签。';
    return '请求参数无效（HTTP 422）。';
  }
  return 'GitHub API 返回 HTTP ' + status + '。';
}

// ===== 直连 GitHub API 创加入队 Issue（不经过 Worker）=====
async function submitViaGitHubApi(data){
  if (!JOIN_GITHUB_PAT) throw new Error('管理员未配置细粒度 PAT 通道。');
  // 把申请码编码成 base64 块塞 Issue body，复用现有解析格式
  var b64 = encodeJoinPayload(data);
  var coachName = '';
  if (data.coachChoice && typeof data.coachChoice === 'string') coachName = data.coachChoice;
  else if (data.coachChoice && data.coachChoice.name) coachName = data.coachChoice.name;

  var title = '入队申请：' + data.name + ' → ' + data.teamName;
  var bodyLines = [
    '**姓名**: ' + data.name,
    '**团队**: ' + data.teamName + ' (id=' + data.team + ')',
    data.qq ? ('**QQ**: ' + data.qq) : '',
    data.desc ? ('**身份 / 警号**: ' + data.desc) : '',
    coachName ? ('**选择教官**: ' + coachName) : '',
    data.bio ? ('**简介**: ' + data.bio) : '',
    '',
    '提交时间: ' + (data.submittedAt || new Date().toISOString()),
    '',
    '<!-- join-payload-base64 -->',
    b64,
    '<!-- /join-payload-base64 -->'
  ];
  var issueBody = bodyLines.filter(Boolean).join('\n');

  var controller = new AbortController();
  var timeoutId = setTimeout(function(){ try { controller.abort(); } catch(e){} }, 25000);
  try {
    var url = 'https://api.github.com/repos/' + JOIN_GITHUB_REPO + '/issues';
    var payload = {
      title: title,
      body: issueBody,
      labels: [JOIN_ISSUE_LABEL || 'join-application']
    };
    var opts = {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + JOIN_GITHUB_PAT,
        'Accept': 'application/vnd.github+json',
        'User-Agent': 'JoinForm/1.0',
        'Content-Type': 'application/json; charset=utf-8'
      },
      body: JSON.stringify(payload),
      cache: 'no-store'
    };
    if (typeof AbortController !== 'undefined' && controller && controller.signal) {
      opts.signal = controller.signal;
    }
    var resp = await fetch(url, opts);
    var respText = '';
    try { respText = await resp.text(); } catch(e){}
    if (!resp.ok) {
      throw new Error(explainGhApiError(resp.status, respText));
    }
    var json = null;
    try { json = JSON.parse(respText); } catch(e){}
    if (!json || !json.html_url) json = { html_url: 'https://github.com/' + JOIN_GITHUB_REPO + '/issues' };
    return json;
  } finally {
    clearTimeout(timeoutId);
  }
}

async function submitToGitHubIssue(data){
  var controller = new AbortController();
  var timeoutId = setTimeout(function(){ try { controller.abort(); } catch(e){} }, 15000);
  try {
    var body = JSON.stringify(data);
    var opts = {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=UTF-8'},
      body: body,
      credentials: 'omit',
      cache: 'no-store'
    };
    if (typeof AbortController !== 'undefined' && controller && controller.signal) {
      opts.signal = controller.signal;
    }
    var response = await fetch(JOIN_API_URL, opts);
    if (!response.ok) {
      var detail = '';
      try {
        var errorData = await response.json();
        var errorMessage = errorData && (errorData.error || errorData.message);
        detail = errorMessage ? '（' + errorMessage + '）' : '';
      } catch(e){}
      throw new Error(explainIssueError(response.status) + detail);
    }
    return response.json();
  } finally {
    clearTimeout(timeoutId);
  }
}

// ===== 加载团队列表（读公开 teams.json，无需 token） =====
function refreshCoachOptions(teamId){
  var coachField = $('coachField');
  var coachSel = $('coach');
  if (!coachField || !coachSel) return;
  coachSel.innerHTML = '<option value="">— 不选择教官 —</option>';
  if (!teamId) { coachField.style.display = 'none'; return; }
  var team = (TEAMS_CACHE || []).find(function(t){ return +t.id === +teamId; });
  var coaches = [];
  if (team && Array.isArray(team.coaches)){
    coaches = team.coaches.filter(function(c){ return c && c.enabled === true && (c.name || c.image); });
  } else if (team && team.coach && typeof team.coach === 'object' && (team.coach.name || team.coach.image)){
    coaches = [team.coach];
  }
  if (!coaches.length) { coachField.style.display = 'none'; return; }
  coaches.forEach(function(c){
    var opt = document.createElement('option');
    // value 存 JSON 字符串，内含 name/image，后续直接随申请走，避免再查
    opt.value = JSON.stringify({ name: c.name || '', image: c.image || '' });
    opt.textContent = (c.name || '(未命名教官)') + (c.bio ? ' — ' + c.bio : '');
    coachSel.appendChild(opt);
  });
  coachField.style.display = 'block';
}
function loadTeams(){
  var sel = $('team');
  sel.innerHTML = '<option value="">加载中…</option>';
  var url = 'teams.json?t=' + Date.now();
  fetch(url, { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error(''+r.status); return r.json(); })
    .then(function(arr){
      TEAMS_CACHE = Array.isArray(arr) ? arr.slice() : [];
      sel.innerHTML = '';
      var list = (arr || []).filter(function(t){
        // 只显示「启用 + 开放申请（joinOpen !== false）」的团队；
        // 后台把某团队开关关掉（不招人）后，这里就不会出现该团队
        return t && t.enabled === true && t.joinOpen !== false && t.name && String(t.name).trim() !== '';
      });
      if (!list.length) {
        sel.innerHTML = '<option value="">（暂无开放申请的团队，请联系管理员）</option>';
        return;
      }
      var defOpt = document.createElement('option');
      defOpt.value = ''; defOpt.textContent = '— 请选择团队 —';
      sel.appendChild(defOpt);
      list.forEach(function(t){
        var opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = (t.icon || '') + ' ' + t.name;
        sel.appendChild(opt);
      });
      refreshCoachOptions(sel.value);
    })
    .catch(function(){
      sel.innerHTML = '<option value="">（团队加载失败）</option>';
    });
}
$('team').addEventListener('change', function(){ refreshCoachOptions(this.value); });

// ===== 头像预览 =====
function refreshAvatarPreview(){
  var qq = $('qq').value.trim();
  var img = $('avatarImg');
  var box = $('avatarPreview');
  var txt = $('avatarText');
  if (qq && /^\d+$/.test(qq)) {
    img.src = 'https://q1.qlogo.cn/g?b=qq&nk=' + encodeURIComponent(qq) + '&s=640&t=' + Date.now();
    img.onerror = function(){ img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="%230b0f2a"/><text x="32" y="38" font-size="28" text-anchor="middle">👤</text></svg>'; };
    txt.textContent = '将用 QQ(' + qq + ') 的实时头像';
    box.style.display = 'flex';
  } else {
    img.src = '';
    box.style.display = 'none';
  }
}

// ===== 判断是否有自动提交通道 =====
function hasAutoChannel(){
  return !!(JOIN_GITHUB_PAT && JOIN_GITHUB_PAT.length > 10) || !!JOIN_API_URL;
}
function showSuccessResult(issue, data, teamName){
  $('resultTitle').textContent = '申请已提交，等待管理员审批';
  $('resultDesc').textContent = '申请已经直接进入管理员后台，不需要再把申请码发给管理员。管理员审批通过后，你的名片会出现在「' + teamName + '」团队主页。';
  $('resultLink').value = (issue && issue.html_url) || '';
  $('resultCode').value = encodeJoinPayload(data);
  $('resultCard').classList.add('show');
}
function showFallbackResult(data, errMsg){
  var code = encodeJoinPayload(data);
  var adminUrl = guessAdminUrl();
  var link = (adminUrl.indexOf('http') === 0)
    ? adminUrl + '?join=' + encodeURIComponent(code)
    : adminUrl;
  $('resultCode').value = code;
  $('resultLink').value = link;
  $('resultTitle').textContent = '已生成备用申请码';
  $('resultDesc').textContent = '自动通道暂不可用，请把申请链接或申请码发给管理员，由管理员导入后台审批。';
  $('resultCard').classList.add('show');
  if (errMsg) {
    showStatus('err',
      '⚠️ 提交失败：' + errMsg + '\n' +
      '已自动生成备用申请码，请把下面的申请链接或申请码发给管理员审批。'
    );
  } else {
    showStatus('info', '已生成申请码，请把下面的申请链接或申请码发给管理员审批。');
  }
}

// ===== 远程提交：优先直连 GitHub API → 回退 Worker → 最终兜底申请码 =====
async function submit(){
  var name = $('name').value.trim();
  var teamVal = $('team').value;
  var teamName = $('team').selectedOptions[0] ? $('team').selectedOptions[0].textContent.replace(/^[^\w\u4e00-\u9fa5]+/, '').trim() : '';
  var qq = $('qq').value.trim();
  var desc = $('desc').value.trim();
  var bio = $('bio').value.trim();
  var coachRaw = $('coach') ? $('coach').value : '';
  var coachChoice = null;
  try { if (coachRaw) coachChoice = JSON.parse(coachRaw); } catch(e){ coachChoice = null; }

  if (!name) { showStatus('err', '❌ 请填写姓名'); $('name').focus(); return; }
  if (!teamVal) { showStatus('err', '❌ 请选择所属团队'); $('team').focus(); return; }
  if (qq && !/^\d+$/.test(qq)) { showStatus('err', '❌ QQ号只能是纯数字'); $('qq').focus(); return; }

  var data = {
    name: name,
    team: +teamVal,
    teamName: teamName,
    qq: qq,
    image: qq ? ('qq:' + qq) : '',
    desc: desc,
    bio: bio,
    coachChoice: coachChoice,
    submittedAt: new Date().toISOString()
  };

  var btn = $('submitBtn');
  btn.disabled = true;
  btn.textContent = hasAutoChannel() ? '提交中…' : '生成申请码中…';

  var autoError = '';

  // 第 1 优先：直连 GitHub API（模式 A）
  if (JOIN_GITHUB_PAT && JOIN_GITHUB_PAT.length > 10) {
    try {
      showStatus('info', '正在通过 GitHub 提交申请…（通道：直连 API）');
      var issue = await submitViaGitHubApi(data);
      showSuccessResult(issue, data, teamName);
      showStatus('ok', '✅ 申请已提交成功！\n管理员在后台「📨 待审批入队申请 → 从 GitHub 拉取」就能看到你的申请。');
      btn.disabled = false;
      btn.textContent = '✅ 已提交';
      return;
    } catch(e){
      autoError = (e && e.message || String(e));
      showStatus('err', '⚠️ 直连通道失败：' + autoError + '\n正在尝试备用通道…');
    }
  }

  // 第 2 优先：Worker 通道（模式 B，一般为空）
  if (JOIN_API_URL) {
    try {
      showStatus('info', '正在通过异地通道提交申请…（通道：Worker）');
      var issue2 = await submitToGitHubIssue(data);
      showSuccessResult(issue2, data, teamName);
      showStatus('ok', '✅ 申请已远程提交成功。\n管理员审批通过后，你的名片会出现在「' + teamName + '」团队主页。');
      btn.disabled = false;
      btn.textContent = '✅ 已提交';
      return;
    } catch(e) {
      if (!autoError) autoError = (e && e.message || String(e));
      else autoError += '；Worker: ' + (e && e.message || String(e));
    }
  }

  // 最终兜底：申请码
  showFallbackResult(data, autoError);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  btn.disabled = false;
  btn.textContent = '🔄 重新生成申请';
}

function copyToClip(text, okMsg){
  var done = false, errMsg = '';
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ done = true; }, function(e){ errMsg = e && e.message || 'clipboard fail'; });
    }
  } catch(e){ errMsg = String(e); }
  setTimeout(function(){
    if (done) {
      showStatus('ok', okMsg || '✅ 已复制到剪贴板');
      return;
    }
    // 兼容回退：用 textarea.select + execCommand
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      showStatus(ok ? 'ok' : 'err', ok
        ? (okMsg || '✅ 已复制到剪贴板')
        : '⚠️ 自动复制失败，请手动选中并 Ctrl+C 复制。' + (errMsg ? '（'+errMsg+'）' : '')
      );
    } catch(e){
      showStatus('err', '⚠️ 自动复制失败，请手动选中并 Ctrl+C 复制。');
    }
  }, done ? 0 : 500);
}

// ===== 绑定 =====
$('useQQBtn').onclick = refreshAvatarPreview;
$('qq').addEventListener('input', function(){
  if ($('avatarPreview').style.display !== 'none') refreshAvatarPreview();
});
$('submitBtn').onclick = submit;
$('resetBtn').onclick = function(){
  ['name','qq','desc','bio'].forEach(function(id){ $(id).value = ''; });
  $('team').selectedIndex = 0;
  refreshCoachOptions('');
  if ($('coach')) $('coach').selectedIndex = 0;
  refreshAvatarPreview();
  $('status').className = 'status';
  $('status').textContent = '';

  $('resultCode').value = '';
  $('resultLink').value = '';
  $('submitBtn').textContent = hasAutoChannel() ? '🚀 提交申请' : '🚀 生成申请码';
};
$('copyLinkBtn').onclick = function(){ copyToClip($('resultLink').value, '✅ 申请链接已复制，直接发给管理员点一下就能在后台导入审批。'); };
$('copyCodeBtn').onclick = function(){ copyToClip($('resultCode').value, '✅ 申请码已复制，发给管理员让他在后台「导入申请码」粘贴即可。'); };
$('shareLinkBtn').onclick = function(){ copyToClip($('resultLink').value, '✅ 申请链接已复制，粘贴发给管理员即可。'); };

loadTeams();
if (!hasAutoChannel()) {
  $('warnBanner').classList.add('show');

} else {

}
