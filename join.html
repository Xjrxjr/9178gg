<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加入我们 · 人员录入</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0b0f2a 0%, #151b4b 40%, #3b1f5a 70%, #0e2a4a 100%);
    min-height: 100vh;
    padding: 24px 16px;
    color: #fff;
    position: relative;
    overflow-x: hidden;
  }
  /* 背景光晕 */
  body::before {
    content: '';
    position: fixed;
    top: -10%; left: -10%;
    width: 60%; height: 60%;
    background: radial-gradient(circle, rgba(25,118,210,0.25) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -10%; right: -10%;
    width: 55%; height: 55%;
    background: radial-gradient(circle, rgba(94,53,177,0.22) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header .badge {
    display: inline-block;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(10px);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #ffd700;
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 30px;
    font-weight: bold;
    background: linear-gradient(90deg, #fff 0%, #90caf9 50%, #ffd700 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  header p {
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    line-height: 1.6;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    border-radius: 18px;
    padding: 26px 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 13px;
    color: #b3d4ff;
    margin-bottom: 7px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .field label .req { color: #ff5252; margin-left: 2px; }
  .field label .hint { color: rgba(255,255,255,0.45); font-weight: normal; font-size: 11px; }
  .field input[type="text"],
  .field input[type="number"],
  .field select,
  .field textarea {
    width: 100%;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;
    padding: 12px 14px;
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    outline: none;
    border-color: #64b5f6;
    box-shadow: 0 0 0 3px rgba(100,181,246,0.18);
  }
  .field textarea { resize: vertical; min-height: 80px; }
  .field select option { background: #151b4b; color: #fff; }
  .qq-row { display: flex; gap: 8px; }
  .qq-row input { flex: 1; }
  .qq-row button {
    background: linear-gradient(135deg, #1976d2, #1565c0);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 14px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.15s;
  }
  .qq-row button:hover { transform: translateY(-1px); }
  .avatar-preview {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 10px;
    padding: 10px 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 10px;
  }
  .avatar-preview img {
    width: 64px; height: 64px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,215,0,0.4);
    background: #0b0f2a;
  }
  .avatar-preview .av-text { font-size: 12px; color: rgba(255,255,255,0.6); }
  .submit-row {
    margin-top: 8px;
    display: flex;
    gap: 10px;
  }
  .btn-submit {
    flex: 1;
    background: linear-gradient(135deg, #ffd700 0%, #ffb300 100%);
    color: #0b0f2a;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,215,0,0.3); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-reset {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-reset:hover { background: rgba(255,255,255,0.14); }
  .status {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
    white-space: pre-wrap;
  }
  .status.show { display: block; }
  .status.info  { background: rgba(25,118,210,0.18); border: 1px solid rgba(100,181,246,0.4); color: #bbdefb; }
  .status.ok    { background: rgba(46,125,50,0.20); border: 1px solid rgba(102,187,106,0.5); color: #c8e6c9; }
  .status.err   { background: rgba(211,47,47,0.18); border: 1px solid rgba(239,154,154,0.5); color: #ffcdd2; }
  .warn-banner {
    margin-bottom: 18px;
    padding: 12px 14px;
    background: rgba(255,152,0,0.15);
    border: 1px solid rgba(255,183,77,0.5);
    border-radius: 10px;
    font-size: 13px;
    color: #ffe0b2;
    line-height: 1.5;
    display: none;
  }
  .warn-banner.show { display: block; }
  footer {
    text-align: center;
    margin-top: 22px;
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    line-height: 1.6;
  }
  footer a { color: #90caf9; text-decoration: none; }
  @media (max-width: 520px) {
    header h1 { font-size: 24px; }
    .card { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">⚡ 加入我们</span>
    <h1>填写你的入队信息</h1>
    <p>提交后将由管理员审批，通过后你的名片会展示在团队主页，并显示欢迎横幅。</p>
  </header>

  <div class="warn-banner" id="warnBanner">
    ⚠️ 提交通道尚未配置：管理员还没把「仅 Issue 写权限」的低权 PAT 填进本页面。
    请联系管理员完成一次配置后再提交。
  </div>

  <div class="card">
    <div class="field">
      <label>姓名 / 游戏ID <span class="req">*</span></label>
      <input type="text" id="name" placeholder="例：张三" maxlength="30">
    </div>

    <div class="field">
      <label>所属团队 <span class="req">*</span></label>
      <select id="team"><option value="">加载中…</option></select>
    </div>

    <div class="field">
      <label>QQ号 <span class="hint">（用作头像来源；不填则无个人头像）</span></label>
      <div class="qq-row">
        <input type="text" id="qq" placeholder="纯数字QQ号" inputmode="numeric" pattern="[0-9]*" maxlength="15">
        <button type="button" id="useQQBtn">🐧 预览头像</button>
      </div>
      <div class="avatar-preview" id="avatarPreview" style="display:none;">
        <img id="avatarImg" src="" alt="头像预览">
        <div class="av-text" id="avatarText"></div>
      </div>
    </div>

    <div class="field">
      <label>身份 / 警号 <span class="hint">（例：警员-警号2010 / 队员 / 副手）</span></label>
      <input type="text" id="desc" placeholder="例：警员-警号2010" maxlength="40">
    </div>

    <div class="field">
      <label>个人简介 <span class="hint">（选填，会在详情页展示）</span></label>
      <textarea id="bio" placeholder="一句话介绍自己，多行也行" maxlength="200"></textarea>
    </div>

    <div class="submit-row">
      <button class="btn-submit" id="submitBtn" type="button">🚀 提交申请</button>
      <button class="btn-reset" id="resetBtn" type="button">清空</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <footer>
    提交即代表同意管理员展示你的信息。<br>
    本表单通过 GitHub Issue 提交，无需登录。有问题联系管理员。
  </footer>
</div>

<script>
// ===== 配置区 =====
var OWNER = 'Xjrxjr';
var REPO  = '9178gg';

// 🔑 低权 PAT：仅「Issues: Read and write」权限、仅限本仓库的【细粒度 PAT】。
// 管理员只需配置一次：去 GitHub → Settings → Developer settings → Fine-grained tokens
//   → Repository access: 仅选 Xjrxjr/9178gg
//   → Permissions → Repository permissions → Issues: Read and write（其它一律 No access）
//   → 生成后把整串粘到下面引号里，然后把这个 join.html 推到仓库即可。
// ⚠️ 这个 token 会被放在公开页面里，所以一定要用【细粒度 + 仅 Issues 权限】的，
//    千万不要把你后台那个有完整写权限的 PAT 填到这里。
var JOIN_PAT = 'PASTE_FINEGRAINED_ISSUES_ONLY_PAT_HERE';

// ===== 工具 =====
function $(id){ return document.getElementById(id); }
function showStatus(type, msg){
  var el = $('status');
  el.className = 'status show ' + type;
  el.textContent = msg;
}
function getImgSrc(src){
  if (!src) return '';
  if (src.indexOf('qq:') === 0) {
    var qq = src.substring(3);
    return 'https://q1.qlogo.cn/g?b=qq&nk=' + encodeURIComponent(qq) + '&s=640&t=' + Date.now();
  }
  return src;
}
function explainErr(status){
  if (status === 401) return 'PAT 无效（401）：管理员填的 token 过期或拼错了，请联系管理员重新生成。';
  if (status === 403) return 'PAT 无权限（403）：管理员填的 token 没有 Issues 写权限，或没选这个仓库，请联系管理员。';
  if (status === 404) return '仓库不存在（404）：目标仓库 ' + OWNER + '/' + REPO + ' 找不到，或 token 对私有仓库无权限。';
  if (status === 422) return '请求被拒（422）：可能仓库关闭了 Issue 功能，或内容格式不对。请联系管理员开启 Issues。';
  return 'GitHub 返回状态码：' + status;
}

// ===== 加载团队列表（读公开 teams.json，无需 token） =====
function loadTeams(){
  var sel = $('team');
  sel.innerHTML = '<option value="">加载中…</option>';
  var url = 'teams.json?t=' + Date.now();
  fetch(url, { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error(''+r.status); return r.json(); })
    .then(function(arr){
      sel.innerHTML = '';
      var list = (arr || []).filter(function(t){
        // 只显示「启用 + 开放申请（joinOpen !== false）」的团队；
        // 后台把某团队开关关掉（不招人）后，这里就不会出现该团队
        return t && t.enabled === true && t.joinOpen !== false && t.name && String(t.name).trim() !== '';
      });
      if (!list.length) {
        sel.innerHTML = '<option value="">（暂无开放申请的团队，请联系管理员）</option>';
        return;
      }
      list.forEach(function(t){
        var opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = (t.icon || '') + ' ' + t.name;
        sel.appendChild(opt);
      });
    })
    .catch(function(){
      sel.innerHTML = '<option value="">（团队加载失败）</option>';
    });
}

// ===== 头像预览 =====
function refreshAvatarPreview(){
  var qq = $('qq').value.trim();
  var img = $('avatarImg');
  var box = $('avatarPreview');
  var txt = $('avatarText');
  if (qq && /^\d+$/.test(qq)) {
    img.src = 'https://q1.qlogo.cn/g?b=qq&nk=' + encodeURIComponent(qq) + '&s=640&t=' + Date.now();
    img.onerror = function(){ img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="%230b0f2a"/><text x="32" y="38" font-size="28" text-anchor="middle">👤</text></svg>'; };
    txt.textContent = '将用 QQ(' + qq + ') 的实时头像';
    box.style.display = 'flex';
  } else {
    img.src = '';
    box.style.display = 'none';
  }
}

// ===== 提交：创建 GitHub Issue =====
function buildBody(data){
  var lines = [];
  lines.push('### 入队申请');
  lines.push('');
  lines.push('| 字段 | 内容 |');
  lines.push('| --- | --- |');
  lines.push('| 姓名 | ' + data.name + ' |');
  lines.push('| 团队 | ' + data.teamName + ' (id=' + data.team + ') |');
  lines.push('| QQ号 | ' + (data.qq || '(未填)') + ' |');
  lines.push('| 身份/警号 | ' + (data.desc || '(未填)') + ' |');
  lines.push('| 简介 | ' + (data.bio || '(未填)') + ' |');
  lines.push('| 提交时间 | ' + new Date().toLocaleString('zh-CN') + ' |');
  lines.push('');
  lines.push('<!-- 后台解析用，请勿修改下面这块 -->');
  lines.push('```json');
  lines.push(JSON.stringify(data, null, 2));
  lines.push('```');
  return lines.join('\n');
}

function parseIssueBody(body){
  // 从 issue body 里抽出 ```json ... ``` 块
  if (!body) return null;
  var m = body.match(/```json\s*([\s\S]*?)```/i);
  if (!m) return null;
  try { return JSON.parse(m[1].trim()); } catch(e){ return null; }
}

function submit(){
  if (!JOIN_PAT || JOIN_PAT.indexOf('PASTE_') === 0) {
    showStatus('err', '❌ 提交通道尚未配置：管理员还没把低权 PAT 填进 join.html。\n请联系管理员完成配置后再提交。');
    return;
  }
  var name = $('name').value.trim();
  var teamVal = $('team').value;
  var teamName = $('team').selectedOptions[0] ? $('team').selectedOptions[0].textContent.replace(/^[^\w\u4e00-\u9fa5]+/, '').trim() : '';
  var qq = $('qq').value.trim();
  var desc = $('desc').value.trim();
  var bio = $('bio').value.trim();

  if (!name) { showStatus('err', '❌ 请填写姓名'); $('name').focus(); return; }
  if (!teamVal) { showStatus('err', '❌ 请选择所属团队'); $('team').focus(); return; }
  if (qq && !/^\d+$/.test(qq)) { showStatus('err', '❌ QQ号只能是纯数字'); $('qq').focus(); return; }

  var data = {
    name: name,
    team: +teamVal,
    teamName: teamName,
    qq: qq,
    image: qq ? ('qq:' + qq) : '',
    desc: desc,
    bio: bio,
    submittedAt: new Date().toISOString()
  };

  var btn = $('submitBtn');
  btn.disabled = true;
  var orig = btn.textContent;
  btn.textContent = '提交中…';
  showStatus('info', '正在提交申请…');

  var title = '入队申请：' + name + ' → ' + teamName;
  var body = buildBody(data);

  fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/issues', {
    method: 'POST',
    headers: {
      'Accept': 'application/vnd.github+json',
      'Authorization': 'Bearer ' + JOIN_PAT,
      'X-GitHub-Api-Version': '2022-11-28',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ title: title, body: body })
  })
  .then(function(r){
    if (r.ok) return r.json();
    // 读出错误信息再抛
    return r.text().then(function(t){
      var msg = explainErr(r.status);
      try { var j = JSON.parse(t); if (j && j.message) msg += '\n详细：' + j.message; } catch(e){}
      throw new Error(msg);
    });
  })
  .then(function(issue){
    showStatus('ok',
      '✅ 申请已提交！\n' +
      '管理员审批通过后，你的名片就会出现在「' + teamName + '」团队主页顶部，并显示欢迎横幅。\n' +
      (issue && issue.html_url ? '提交记录：' + issue.html_url : '')
    );
    // 清空表单
    $('name').value = '';
    $('qq').value = '';
    $('desc').value = '';
    $('bio').value = '';
    refreshAvatarPreview();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  })
  .catch(function(err){
    var msg = err && err.message ? err.message : String(err);
    if (msg.indexOf('Failed to fetch') >= 0 || msg.indexOf('NetworkError') >= 0 || msg.indexOf('load failed') >= 0) {
      showStatus('err', '❌ 网络请求失败：无法连接 GitHub API。\n请检查网络（尤其是否需要科学上网）后重试。\n\n技术详情：' + msg);
    } else {
      showStatus('err', '❌ 提交失败：\n' + msg);
    }
  })
  .then(function(){
    btn.disabled = false;
    btn.textContent = orig;
  });
}

// ===== 绑定 =====
$('useQQBtn').onclick = refreshAvatarPreview;
$('qq').addEventListener('input', function(){
  // 输入时如果已经显示过预览，就同步刷新；没显示则不打扰
  if ($('avatarPreview').style.display !== 'none') refreshAvatarPreview();
});
$('submitBtn').onclick = submit;
$('resetBtn').onclick = function(){
  ['name','qq','desc','bio'].forEach(function(id){ $(id).value = ''; });
  $('team').selectedIndex = 0;
  refreshAvatarPreview();
  $('status').className = 'status';
  $('status').textContent = '';
};

// 初始化
if (!JOIN_PAT || JOIN_PAT.indexOf('PASTE_') === 0) {
  $('warnBanner').classList.add('show');
}
loadTeams();
// 暴露给 admin 端复用（解析 issue body）
window.__parseJoinIssueBody = parseIssueBody;
window.__JOIN_TITLE_PREFIX = '入队申请：';
</script>
</body>
</html>
