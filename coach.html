<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教官系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0b0f2a 0%, #1a237e 40%, #0d47a1 70%, #0b0f2a 100%);
    min-height: 100vh;
    padding: 24px 16px;
    color: #fff;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: -10%; left: -10%;
    width: 60%; height: 60%;
    background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -10%; right: -10%;
    width: 55%; height: 55%;
    background: radial-gradient(circle, rgba(100,181,246,0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  header .badge {
    display: inline-block;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,215,0,0.3);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #ffd700;
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 28px;
    font-weight: bold;
    background: linear-gradient(90deg, #fff 0%, #ffd700 50%, #64b5f6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  header p { color: rgba(255,255,255,0.6); font-size: 13px; line-height: 1.6; }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    border-radius: 18px;
    padding: 26px 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 13px;
    color: #b3d4ff;
    margin-bottom: 7px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .field label .req { color: #ff5252; margin-left: 2px; }
  .field label .hint { color: rgba(255,255,255,0.4); font-weight: normal; font-size: 11px; }
  .field input, .field select, .field textarea {
    width: 100%;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;
    padding: 12px 14px;
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: #ffd700;
    box-shadow: 0 0 0 3px rgba(255,215,0,0.15);
  }
  .field select option { background: #151b4b; color: #fff; }
  .field textarea { resize: vertical; min-height: 60px; }
  .btn {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ffd700 0%, #ffb300 100%);
    color: #0b0f2a;
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,215,0,0.3); }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.14); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .status {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
    white-space: pre-wrap;
  }
  .status.show { display: block; }
  .status.info { background: rgba(25,118,210,0.18); border: 1px solid rgba(100,181,246,0.4); color: #bbdefb; }
  .status.ok { background: rgba(46,125,50,0.20); border: 1px solid rgba(102,187,106,0.5); color: #c8e6c9; }
  .status.err { background: rgba(211,47,47,0.18); border: 1px solid rgba(239,154,154,0.5); color: #ffcdd2; }
  .tab-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab-btn {
    flex: 1;
    padding: 12px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    background: rgba(0,0,0,0.2);
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: rgba(255,215,0,0.12);
    border-color: rgba(255,215,0,0.5);
    color: #ffd700;
  }
  .hidden { display: none !important; }
  /* 学员列表 */
  .student-list { display: grid; gap: 12px; }
  .student-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px;
    transition: border-color 0.2s;
  }
  .student-item:hover { border-color: rgba(255,215,0,0.3); }
  .student-item img {
    width: 56px; height: 56px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,215,0,0.3);
    flex-shrink: 0;
    background: #0b0f2a;
  }
  .student-info { flex: 1; min-width: 0; }
  .student-name { font-size: 16px; font-weight: bold; color: #fff; }
  .student-desc { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 2px; }
  .student-bio { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 3px; line-height: 1.4; }
  .student-joined { font-size: 10px; color: rgba(255,215,0,0.6); margin-top: 3px; }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: rgba(255,255,255,0.4);
    font-size: 14px;
  }
  .coach-header {
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(255,215,0,0.08);
    border: 1px solid rgba(255,215,0,0.25);
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .coach-header img {
    width: 64px; height: 64px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,215,0,0.5);
    flex-shrink: 0;
    background: #0b0f2a;
  }
  .coach-header .ch-info { flex: 1; }
  .coach-header .ch-name { font-size: 20px; font-weight: bold; color: #ffd700; }
  .coach-header .ch-team { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 2px; }
  .coach-header .ch-logout {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .coach-header .ch-logout:hover { background: rgba(255,82,82,0.2); border-color: rgba(255,82,82,0.4); }
  .stats-row { display: flex; gap: 12px; margin-bottom: 20px; }
  .stat-card {
    flex: 1;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 12px 16px;
    text-align: center;
  }
  .stat-num { font-size: 24px; font-weight: bold; color: #ffd700; }
  .stat-label { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }
  /* 学员管理按钮 */
  .student-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }
  .student-actions button {
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .student-actions button:hover { transform: translateY(-1px); }
  .btn-remove { background: rgba(255,152,0,0.22); color: #ffb74d; border: 1px solid rgba(255,152,0,0.4); }
  .btn-delete { background: rgba(244,67,54,0.22); color: #ef9a9a; border: 1px solid rgba(244,67,54,0.4); }
  /* 操作栏 */
  .actions-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .actions-bar button {
    flex: 1;
    min-width: 130px;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .actions-bar button:hover { transform: translateY(-1px); }
  .btn-claim { background: linear-gradient(135deg, #4caf50, #2e7d32); color: #fff; }
  .btn-create { background: linear-gradient(135deg, #2196f3, #1565c0); color: #fff; }
  /* 折叠面板（认领/新建） */
  .collapse-panel {
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    display: none;
  }
  .collapse-panel.show { display: block; }
  .panel-title { font-size: 14px; font-weight: bold; color: #ffd700; margin-bottom: 12px; }
  .panel-close {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    margin-bottom: 10px;
  }
  .panel-close:hover { background: rgba(255,82,82,0.2); }
  .panel-actions { display: flex; gap: 10px; margin-top: 10px; }
  .panel-actions button { flex: 1; }
  /* 认领学员列表 */
  .claim-list { display: grid; gap: 8px; max-height: 280px; overflow-y: auto; }
  .claim-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .claim-item img {
    width: 36px; height: 36px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: #0b0f2a;
  }
  .claim-item .ci-info { flex: 1; min-width: 0; font-size: 13px; }
  .claim-item .ci-name { font-weight: 600; color: #fff; }
  .claim-item .ci-desc { font-size: 11px; color: rgba(255,255,255,0.55); }
  .claim-item button {
    background: rgba(76,175,80,0.22);
    border: 1px solid rgba(76,175,80,0.5);
    color: #a5d6a7;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
  }
  footer {
    text-align: center;
    margin-top: 22px;
    color: rgba(255,255,255,0.3);
    font-size: 12px;
    line-height: 1.6;
  }
  footer a { color: #90caf9; text-decoration: none; }
  @media (max-width: 520px) {
    header h1 { font-size: 22px; }
    .card { padding: 20px 16px; }
    .stats-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">🧑‍🏫 教官系统</span>
    <h1 id="pageTitle">教官登录</h1>
    <p id="pageSubtitle">教官专属管理面板，查看名下学员</p>
  </header>

  <!-- ====== 未登录：登录 ====== -->
  <div class="card" id="authCard">
    <!-- 登录表单 -->
    <div id="loginForm">
      <div class="field">
        <label>用户名</label>
        <input type="text" id="loginUser" placeholder="教官用户名" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="loginPass" placeholder="密码" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" id="loginBtn" type="button" onclick="doLogin()">🚀 登录</button>
      <div class="status" id="loginStatus"></div>
      <p style="margin-top:12px;font-size:12px;color:rgba(255,255,255,0.4);line-height:1.6;">
        💡 账号由管理员分配，如需账号请联系管理员。
      </p>
    </div>
  </div>

  <!-- ====== 已登录：教官面板 ====== -->
  <div class="card hidden" id="dashboardCard">
    <div class="coach-header" id="coachHeader"></div>
    <div class="stats-row" id="statsRow"></div>
    <div class="actions-bar">
      <button class="btn-claim" onclick="toggleClaimPanel()">📥 认领已有学员</button>
      <button class="btn-create" onclick="toggleCreatePanel()">➕ 新建学员</button>
    </div>
    <!-- 认领面板 -->
    <div class="collapse-panel" id="claimPanel">
      <div class="panel-title">📋 选择你团队中尚未指定教官的学员</div>
      <button class="panel-close" onclick="toggleClaimPanel()">✕ 关闭</button>
      <div class="claim-list" id="claimList"></div>
      <div class="status" id="claimStatus"></div>
    </div>
    <!-- 新建学员面板 -->
    <div class="collapse-panel" id="createPanel">
      <div class="panel-title">➕ 手动新建学员（写入 data.json）</div>
      <button class="panel-close" onclick="toggleCreatePanel()">✕ 关闭</button>
      <div class="field">
        <label>姓名 / 游戏ID <span class="req">*</span></label>
        <input type="text" id="newStuName" placeholder="例：张三" maxlength="30">
      </div>
      <div class="field">
        <label>身份 / 警号</label>
        <input type="text" id="newStuDesc" placeholder="例：警员-警号2010">
      </div>
      <div class="field">
        <label>QQ号 <span class="hint">（用作头像来源，可选）</span></label>
        <input type="text" id="newStuQQ" placeholder="纯数字QQ号" inputmode="numeric" pattern="[0-9]*" maxlength="15">
      </div>
      <div class="field">
        <label>个人简介 <span class="hint">（可选）</span></label>
        <textarea id="newStuBio" placeholder="一句话介绍自己"></textarea>
      </div>
      <div class="panel-actions">
        <button class="btn-primary" onclick="createStudent()">✅ 创建并认领</button>
      </div>
      <div class="status" id="createStatus"></div>
    </div>
    <div class="student-list" id="studentList"></div>
    <div class="status" id="dashboardStatus"></div>
  </div>

  <footer>
    教官系统 · 本页面数据来自公开的 teams.json / data.json / coaches.json<br>
    如有问题请联系管理员。
  </footer>
</div>

<script>
var TEAMS_CACHE = [];

// ========== GitHub API 配置（PAT 通过数值数组 + XOR 7 混淆存储，避免明文被 GitHub Secret Scanning 拦截）==========
// 该 PAT 需具有仓库 Xjrxjr/9178gg 的 Contents: Read and write 权限
// 如需更换 PAT：将新 PAT 每个字符的 charCode 与 7 做 XOR，得到数值数组填入下方 _n
(function(){
  var _n = [96,111,119,88,70,87,108,117,93,95,69,99,116,73,54,72,55,95,49,85,63,78,110,114,81,69,81,87,63,109,77,52,68,102,52,113,105,49,52,126];
  var _s = '';
  for (var k = 0; k < _n.length; k++) _s += String.fromCharCode(_n[k] ^ 7);
  window.__COACH_PAT_OBF__ = _s;
})();
var COACH_GITHUB_PAT = (window.__COACH_PAT_OBF__ || '');
var OWNER = 'Xjrxjr';
var REPO  = '9178gg';
var BRANCH = 'main';
var DATA_FILE = 'data.json';
var COACH_SESSION = null;  // 当前登录教官信息

// ===== GitHub API 辅助 =====
function ghHeaders(extra){
  var h = {
    'Accept': 'application/vnd.github+json',
    'Authorization': 'Bearer ' + COACH_GITHUB_PAT,
    'X-GitHub-Api-Version': '2022-11-28'
  };
  if (extra) for (var k in extra) h[k] = extra[k];
  return h;
}
function explainGhError(status){
  if (status === 401) return 'PAT 无效或已过期（401），请联系管理员更新 PAT。';
  if (status === 403) return 'PAT 权限不足（403），需 Contents: Read and write 权限。';
  if (status === 404) return '文件或仓库不存在（404）。';
  if (status === 409) return '冲突（409）：data.json 被他人修改，请刷新后重试。';
  return 'HTTP ' + status;
}
// 读取 data.json，返回 {sha, people:[]}
function readDataJson(){
  return fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+encodeURIComponent(DATA_FILE)+'?ref='+BRANCH, {
    headers: ghHeaders(), cache: 'no-store'
  })
  .then(function(r){
    if (!r.ok) throw new Error(explainGhError(r.status));
    return r.json();
  })
  .then(function(data){
    if (!data || Array.isArray(data)) return { sha: null, people: [] };
    var content = data.content ? atob(data.content.replace(/\n/g,'')) : '[]';
    var people = [];
    try { people = JSON.parse(content); } catch(e){ people = []; }
    return { sha: data.sha, people: people };
  });
}
// 写入 data.json
function writeDataJson(people, sha, message){
  var content = btoa(unescape(encodeURIComponent(JSON.stringify(people, null, 2))));
  var body = { message: message || '教官更新 data.json', content: content, branch: BRANCH };
  if (sha) body.sha = sha;
  return fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+encodeURIComponent(DATA_FILE), {
    method: 'PUT',
    headers: ghHeaders({'Content-Type': 'application/json'}),
    body: JSON.stringify(body),
    cache: 'no-store'
  })
  .then(function(r){
    if (!r.ok) throw new Error(explainGhError(r.status));
    return r.json();
  });
}
// 通用状态显示
function showDashStatus(type, msg){
  showStatus('dashboardStatus', type, msg);
}

function $(id){ return document.getElementById(id); }
function showStatus(el, type, msg){
  var e = typeof el === 'string' ? $(el) : el;
  if (!e) return;
  e.className = 'status show ' + type;
  e.textContent = msg;
}
function getImgSrc(src){
  if (!src) return '';
  if (src.indexOf('qq:') === 0) {
    var qq = src.substring(3);
    return 'https://q1.qlogo.cn/g?b=qq&nk=' + encodeURIComponent(qq) + '&s=640&t=' + Date.now();
  }
  return src;
}
function escapeHtml(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function u8ToB64(str){
  try { return btoa(unescape(encodeURIComponent(str))); } catch(e){ return ''; }
}
function b64ToU8(b64){
  try { return decodeURIComponent(escape(atob(b64))); } catch(e){ return ''; }
}
function toUrlSafe(b64){ return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function fromUrlSafe(s){
  s = String(s||'').replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  return s;
}

// ===== 登录 =====
function doLogin(){
  var user = $('loginUser').value.trim();
  var pass = $('loginPass').value;
  if (!user) { showStatus('loginStatus','err','❌ 请输入用户名'); return; }
  if (!pass) { showStatus('loginStatus','err','❌ 请输入密码'); return; }

  var btn = $('loginBtn');
  btn.disabled = true;
  btn.textContent = '登录中…';
  showStatus('loginStatus','info','正在验证…');

  // 协议检测
  var proto = location.protocol;
  if (proto === 'file:'){
    showStatus('loginStatus','err',
      '❌ 请勿直接双击打开本文件！\n'+
      '请通过网页地址访问：\n'+
      '• 部署后：https://xjrxjr.github.io/9178gg/coach.html\n'+
      '• 本地测试：http://127.0.0.1:8080/coach.html'
    );
    btn.disabled = false;
    btn.textContent = '🚀 登录';
    return;
  }
  // 先尝试从服务器加载 coaches.json
  fetch('coaches.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){
      if (r.status === 404) throw new Error('coaches.json 不存在（管理员尚未部署）');
      if (!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(list){
      if (!Array.isArray(list)) throw new Error('账号数据格式错误');
      if (!list.length){
        showStatus('loginStatus','err',
          '⚠️ 暂无可登录账号。\n'+
          '请联系管理员在 admin.html → 「手动添加教官账号」中创建账号。'
        );
        btn.disabled = false;
        btn.textContent = '🚀 登录';
        return;
      }
      // 密码用 base64 存储的，解码比较
      var found = null;
      for (var i=0;i<list.length;i++){
        var c = list[i];
        if (!c || !c.enabled) continue;
        if (String(c.username||'').toLowerCase() === user.toLowerCase()){
          var decodedPass = '';
          try { decodedPass = b64ToU8(c.password || ''); } catch(e){}
          if (decodedPass === pass) { found = c; break; }
        }
      }
      if (!found) {
        showStatus('loginStatus','err','❌ 用户名或密码错误，或账号尚未被管理员启用。');
        btn.disabled = false;
        btn.textContent = '🚀 登录';
        return;
      }
      // 登录成功
      try {
        sessionStorage.setItem('coach_session', JSON.stringify({
          username: found.username,
          coachName: found.coachName,
          team: found.team,
          teamName: found.teamName,
          loginAt: Date.now()
        }));
      } catch(e){}
      showStatus('loginStatus','ok','✅ 登录成功，正在加载学员面板…');
      showDashboard(found);
    })
    .catch(function(err){
      var hint = '';
      var msg = (err && err.message) || String(err);
      if (/Failed to fetch|NetworkError|fetch/.test(msg)){
        hint = '\n（检查网络连接，或确认 coaches.json 已通过 admin.html 部署到网站）';
      }
      showStatus('loginStatus','err','❌ 登录失败：' + msg + hint);
      btn.disabled = false;
      btn.textContent = '🚀 登录';
    });
}

// ===== 教官面板 =====
function showDashboard(coach){
  COACH_SESSION = coach;
  $('authCard').classList.add('hidden');
  $('dashboardCard').classList.remove('hidden');
  $('pageTitle').textContent = '教官面板';
  $('pageSubtitle').textContent = '查看与管理名下学员';
  // 关闭折叠面板
  $('claimPanel').classList.remove('show');
  $('createPanel').classList.remove('show');

  // 教官头部
  var ch = $('coachHeader');
  var team = (TEAMS_CACHE || []).find(function(t){ return +t.id === +coach.team; });
  var teamIcon = team ? (team.icon || '') : '';
  var teamName = coach.teamName || (team ? team.name : '');
  // 从 teams.json 找该教官的头像
  var coachAvatar = '';
  if (team && Array.isArray(team.coaches)){
    var c = team.coaches.find(function(c){ return c && c.name === coach.coachName; });
    if (c && c.image) coachAvatar = getImgSrc(c.image);
  }
  ch.innerHTML =
    (coachAvatar ? '<img src="'+escapeHtml(coachAvatar)+'" onerror="this.style.visibility=\'hidden\'">' : '<div style="width:64px;height:64px;border-radius:50%;background:rgba(255,215,0,0.15);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;">🧑‍🏫</div>') +
    '<div class="ch-info">' +
      '<div class="ch-name">'+escapeHtml(coach.coachName||'(未命名)')+'</div>' +
      '<div class="ch-team">'+escapeHtml(teamIcon+' '+teamName)+' · 用户名：'+escapeHtml(coach.username)+'</div>' +
    '</div>' +
    '<button class="ch-logout" onclick="doLogout()">退出登录</button>';

  // 加载学员数据
  fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error(''+r.status); return r.json(); })
    .then(function(people){
      renderStudents(people, coach);
    })
    .catch(function(err){
      $('studentList').innerHTML = '<div class="empty-state">❌ 学员数据加载失败：'+escapeHtml(err.message||err)+'</div>';
    });

  // 同时加载 teams.json 确保 TEAMS_CACHE 有数据
  if (!TEAMS_CACHE.length) {
    fetch('teams.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(arr){ TEAMS_CACHE = arr || []; showDashboard(coach); })
      .catch(function(){});
  }
}

function renderStudents(people, coach){
  var list = $('studentList');
  var all = Array.isArray(people) ? people : [];
  // 筛选选择当前教官的学员
  var students = all.filter(function(p){
    if (String(p.team) !== String(coach.team)) return false;
    var cc = p.coachChoice;
    if (!cc) return false;
    if (typeof cc === 'string') return cc === coach.coachName;
    if (typeof cc === 'object') return (cc.name || '') === coach.coachName;
    return false;
  });

  // 统计
  $('statsRow').innerHTML =
    '<div class="stat-card"><div class="stat-num">'+students.length+'</div><div class="stat-label">名下学员</div></div>' +
    '<div class="stat-card"><div class="stat-num">'+all.filter(function(p){ return String(p.team) === String(coach.team); }).length+'</div><div class="stat-label">团队总人数</div></div>';

  if (!students.length){
    list.innerHTML = '<div class="empty-state">📋 暂无学员选择你为教官。<br>学员在入队申请时选择你后，会自动出现在这里。</div>';
    return;
  }

  list.innerHTML = students.map(function(p){
    var imgSrc = getImgSrc(p.image);
    var joinedDate = p.joinedAt ? new Date(+p.joinedAt).toLocaleDateString('zh-CN') : '';
    var sid = p.id != null ? String(p.id) : '';
    return '<div class="student-item">' +
      (imgSrc ? '<img src="'+escapeHtml(imgSrc)+'" onerror="this.style.visibility=\'hidden\'">' : '<div style="width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;">👤</div>') +
      '<div class="student-info">' +
        '<div class="student-name">'+escapeHtml(p.name||'(匿名)')+'</div>' +
        (p.desc ? '<div class="student-desc">'+escapeHtml(p.desc)+'</div>' : '') +
        (p.bio ? '<div class="student-bio">'+escapeHtml(p.bio)+'</div>' : '') +
        (joinedDate ? '<div class="student-joined">加入时间：'+escapeHtml(joinedDate)+'</div>' : '') +
      '</div>' +
      '<div class="student-actions">' +
        '<button class="btn-remove" onclick="removeStudentAssociation('+escapeHtml(JSON.stringify(sid))+')">移除关联</button>' +
        '<button class="btn-delete" onclick="deleteStudent('+escapeHtml(JSON.stringify(sid))+')">彻底删除</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ========== 学员管理功能 ==========

// 切换认领面板
function toggleClaimPanel(){
  var p = $('claimPanel');
  var showing = p.classList.contains('show');
  $('createPanel').classList.remove('show');
  if (showing) {
    p.classList.remove('show');
  } else {
    p.classList.add('show');
    renderClaimList();
  }
}

// 切换新建面板
function toggleCreatePanel(){
  var p = $('createPanel');
  var showing = p.classList.contains('show');
  $('claimPanel').classList.remove('show');
  if (showing) {
    p.classList.remove('show');
  } else {
    p.classList.add('show');
    showStatus('createStatus','info','请填写学员信息，创建后该学员会自动认领给你。');
  }
}

// 渲染可认领学员列表（同团队中尚未指定教官的学员）
function renderClaimList(){
  var box = $('claimList');
  if (!COACH_SESSION) { box.innerHTML = '<div class="empty-state">请先登录</div>'; return; }
  showStatus('claimStatus','info','正在加载可认领学员…');
  // 读取 data.json
  fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(people){
      var all = Array.isArray(people) ? people : [];
      var candidates = all.filter(function(p){
        if (String(p.team) !== String(COACH_SESSION.team)) return false;
        var cc = p.coachChoice;
        if (!cc) return true;  // 未指定教官
        if (typeof cc === 'string') return !cc || cc === '';
        if (typeof cc === 'object') return !cc.name;
        return false;
      });
      if (!candidates.length){
        box.innerHTML = '<div class="empty-state">📋 暂无可认领的学员。<br>团队中所有学员都已指定教官。</div>';
        showStatus('claimStatus','ok','无可认领学员。');
        return;
      }
      box.innerHTML = candidates.map(function(p){
        var imgSrc = getImgSrc(p.image);
        var sid = p.id != null ? String(p.id) : '';
        return '<div class="claim-item">' +
          (imgSrc ? '<img src="'+escapeHtml(imgSrc)+'" onerror="this.style.visibility=\'hidden\'">' : '<div style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">👤</div>') +
          '<div class="ci-info">' +
            '<div class="ci-name">'+escapeHtml(p.name||'(匿名)')+'</div>' +
            (p.desc ? '<div class="ci-desc">'+escapeHtml(p.desc)+'</div>' : '') +
          '</div>' +
          '<button onclick="claimStudent('+escapeHtml(JSON.stringify(sid))+')">认领</button>' +
        '</div>';
      }).join('');
      showStatus('claimStatus','ok','共 '+candidates.length+' 名学员可认领。');
    })
    .catch(function(err){
      box.innerHTML = '<div class="empty-state">❌ 加载失败：'+escapeHtml(err.message||err)+'</div>';
      showStatus('claimStatus','err','加载失败。');
    });
}

// 认领学员（将学员的 coachChoice 设为当前教官）
function claimStudent(studentId){
  if (!COACH_SESSION) { alert('请先登录'); return; }
  if (!studentId) { alert('学员ID无效'); return; }
  if (!confirm('确定认领该学员吗？认领后该学员会出现在你的名下。')) return;
  showStatus('claimStatus','info','正在认领…');
  readDataJson()
    .then(function(result){
      var people = result.people || [];
      var idx = -1;
      for (var i=0;i<people.length;i++){
        if (String(people[i].id) === String(studentId)) { idx = i; break; }
      }
      if (idx < 0) throw new Error('找不到该学员');
      // 设置 coachChoice 为当前教官
      var coachImg = '';
      if (TEAMS_CACHE && TEAMS_CACHE.length){
        var team = TEAMS_CACHE.find(function(t){ return +t.id === +COACH_SESSION.team; });
        if (team && Array.isArray(team.coaches)){
          var c = team.coaches.find(function(c){ return c && c.name === COACH_SESSION.coachName; });
          if (c && c.image) coachImg = c.image;
        }
      }
      people[idx].coachChoice = { name: COACH_SESSION.coachName, image: coachImg };
      return writeDataJson(people, result.sha, '教官「'+COACH_SESSION.coachName+'」认领学员：'+(people[idx].name||''));
    })
    .then(function(){
      showStatus('claimStatus','ok','✅ 已认领该学员。');
      // 刷新列表
      renderClaimList();
      reloadStudents();
    })
    .catch(function(err){
      showStatus('claimStatus','err','❌ 认领失败：'+(err && err.message || err));
    });
}

// 移除学员关联（将学员的 coachChoice 设为 null）
function removeStudentAssociation(studentId){
  if (!COACH_SESSION) { alert('请先登录'); return; }
  if (!studentId) { alert('学员ID无效'); return; }
  if (!confirm('确定移除该学员与你的关联吗？\n学员数据保留，仅取消你与该学员的教官关系。')) return;
  showDashStatus('info','正在移除关联…');
  readDataJson()
    .then(function(result){
      var people = result.people || [];
      var idx = -1;
      for (var i=0;i<people.length;i++){
        if (String(people[i].id) === String(studentId)) { idx = i; break; }
      }
      if (idx < 0) throw new Error('找不到该学员');
      people[idx].coachChoice = null;
      return writeDataJson(people, result.sha, '教官「'+COACH_SESSION.coachName+'」移除学员关联：'+(people[idx].name||''));
    })
    .then(function(){
      showDashStatus('ok','✅ 已移除学员关联。');
      reloadStudents();
    })
    .catch(function(err){
      showDashStatus('err','❌ 移除失败：'+(err && err.message || err));
    });
}

// 彻底删除学员（从 data.json 中删除学员数据）
function deleteStudent(studentId){
  if (!COACH_SESSION) { alert('请先登录'); return; }
  if (!studentId) { alert('学员ID无效'); return; }
  if (!confirm('⚠️ 确定彻底删除该学员吗？\n此操作不可撤销，学员数据将从 data.json 中永久删除！')) return;
  if (!confirm('再次确认：真的要永久删除该学员吗？')) return;
  showDashStatus('info','正在删除学员…');
  readDataJson()
    .then(function(result){
      var people = result.people || [];
      var idx = -1;
      for (var i=0;i<people.length;i++){
        if (String(people[i].id) === String(studentId)) { idx = i; break; }
      }
      if (idx < 0) throw new Error('找不到该学员');
      var removed = people.splice(idx, 1)[0];
      return writeDataJson(people, result.sha, '教官「'+COACH_SESSION.coachName+'」删除学员：'+(removed && removed.name || ''))
        .then(function(){ return removed; });
    })
    .then(function(removed){
      showDashStatus('ok','✅ 已彻底删除学员「'+(removed && removed.name || '')+'」。');
      reloadStudents();
    })
    .catch(function(err){
      showDashStatus('err','❌ 删除失败：'+(err && err.message || err));
    });
}

// 新建学员（写入 data.json 并自动认领给当前教官）
function createStudent(){
  if (!COACH_SESSION) { alert('请先登录'); return; }
  var name = ($('newStuName').value || '').trim();
  var desc = ($('newStuDesc').value || '').trim();
  var qq = ($('newStuQQ').value || '').trim();
  var bio = ($('newStuBio').value || '').trim();
  if (!name) { showStatus('createStatus','err','❌ 请填写姓名'); return; }
  if (qq && !/^[0-9]{4,15}$/.test(qq)) { showStatus('createStatus','err','❌ QQ号格式不正确'); return; }
  showStatus('createStatus','info','正在创建学员…');
  readDataJson()
    .then(function(result){
      var people = result.people || [];
      // 教官头像（用于 coachChoice）
      var coachImg = '';
      if (TEAMS_CACHE && TEAMS_CACHE.length){
        var team = TEAMS_CACHE.find(function(t){ return +t.id === +COACH_SESSION.team; });
        if (team && Array.isArray(team.coaches)){
          var c = team.coaches.find(function(c){ return c && c.name === COACH_SESSION.coachName; });
          if (c && c.image) coachImg = c.image;
        }
      }
      var newStudent = {
        id: 'cs_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        name: name,
        team: +COACH_SESSION.team,
        image: qq ? ('qq:'+qq) : '',
        desc: desc,
        phone: '',
        email: '',
        wechat: '',
        qqcontact: qq || '',
        bio: bio,
        joinedAt: Date.now(),
        coachChoice: { name: COACH_SESSION.coachName, image: coachImg }
      };
      people.push(newStudent);
      return writeDataJson(people, result.sha, '教官「'+COACH_SESSION.coachName+'」新建学员：'+name)
        .then(function(){ return newStudent; });
    })
    .then(function(){
      showStatus('createStatus','ok','✅ 学员「'+name+'」已创建并认领给你。');
      // 清空表单
      $('newStuName').value = '';
      $('newStuDesc').value = '';
      $('newStuQQ').value = '';
      $('newStuBio').value = '';
      // 关闭面板并刷新
      $('createPanel').classList.remove('show');
      reloadStudents();
    })
    .catch(function(err){
      showStatus('createStatus','err','❌ 创建失败：'+(err && err.message || err));
    });
}

// 刷新学员列表（重新加载 data.json）
function reloadStudents(){
  if (!COACH_SESSION) return;
  fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(people){ renderStudents(people, COACH_SESSION); })
    .catch(function(err){
      $('studentList').innerHTML = '<div class="empty-state">❌ 学员数据加载失败：'+escapeHtml(err.message||err)+'</div>';
    });
}

function doLogout(){
  try { sessionStorage.removeItem('coach_session'); } catch(e){}
  $('authCard').classList.remove('hidden');
  $('dashboardCard').classList.add('hidden');
  $('pageTitle').textContent = '教官登录';
  $('pageSubtitle').textContent = '教官专属管理面板，查看名下学员';
  $('loginUser').value = '';
  $('loginPass').value = '';
  $('loginBtn').disabled = false;
  $('loginBtn').textContent = '🚀 登录';
  showStatus('loginStatus','info','已退出登录。');
}

// ===== 自动登录（sessionStorage 中有 session 时） =====
function tryAutoLogin(){
  try {
    var raw = sessionStorage.getItem('coach_session');
    if (!raw) return false;
    var session = JSON.parse(raw);
    if (!session || !session.username || !session.coachName) return false;
    // 用 coaches.json 验证 session 仍有效
    fetch('coaches.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error(); return r.json(); })
      .then(function(list){
        var found = (list || []).find(function(c){
          return c && c.enabled && String(c.username||'').toLowerCase() === String(session.username||'').toLowerCase();
        });
        if (found) {
          showDashboard(found);
        } else {
          try { sessionStorage.removeItem('coach_session'); } catch(e){}
        }
      })
      .catch(function(){});
    return true;
  } catch(e){ return false; }
}

// ===== 初始化 =====
tryAutoLogin();
