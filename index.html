<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人员展示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.95);
    padding: 20px 30px;
    border-radius: 12px;
    margin-bottom: 30px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  }
  header h1 {
    color: #333;
    font-size: 26px;
  }
  .header-actions {
    display: flex;
    gap: 12px;
  }
  .btn {
    background: #667eea;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .btn:hover { background: #5568d3; transform: translateY(-1px); }
  .btn-danger { background: #e74c3c; }
  .btn-danger:hover { background: #c0392b; }
  .btn-success { background: #27ae60; }
  .btn-success:hover { background: #219653; }
  .btn-secondary { background: #95a5a6; }
  .btn-secondary:hover { background: #7f8c8d; }
  .btn-warning { background: #f39c12; }
  .btn-warning:hover { background: #d68910; }
  .btn:disabled { background: #bdc3c7; cursor: not-allowed; transform: none; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.95);
    padding: 15px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    gap: 15px;
    flex-wrap: wrap;
  }
  .search-box {
    flex: 1;
    min-width: 200px;
    padding: 10px 15px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  .search-box:focus { outline: none; border-color: #667eea; }

  .admin-panel {
    background: rgba(255,255,255,0.95);
    padding: 15px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    display: none;
    border-left: 4px solid #27ae60;
  }
  .admin-panel.active { display: block; }
  .admin-panel .panel-title {
    color: #27ae60;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }
  .card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
  .card img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    background: #f0f0f0;
    display: block;
  }
  .card .info {
    padding: 15px;
    text-align: center;
  }
  .card .name {
    font-size: 18px;
    font-weight: bold;
    color: #333;
    margin-bottom: 5px;
  }
  .card .desc {
    font-size: 13px;
    color: #777;
  }
  .card .actions {
    display: none;
    position: absolute;
    top: 8px;
    right: 8px;
    gap: 6px;
  }
  .card .actions button {
    background: rgba(255,255,255,0.9);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .card .actions .edit-btn { color: #f39c12; }
  .card .actions .delete-btn { color: #e74c3c; }
  body.admin-mode .card .actions { display: flex; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: white;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
  }
  .empty-state h3 { font-size: 20px; margin-bottom: 10px; }

  /* 模态框 */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white;
    padding: 30px;
    border-radius: 12px;
    width: 90%;
    max-width: 450px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal h2 {
    color: #333;
    margin-bottom: 20px;
    font-size: 22px;
  }
  .form-group {
    margin-bottom: 15px;
  }
  .form-group label {
    display: block;
    margin-bottom: 6px;
    color: #555;
    font-size: 14px;
    font-weight: 600;
  }
  .form-group input, .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .form-group input:focus, .form-group textarea:focus {
    outline: none;
    border-color: #667eea;
  }
  .form-group .hint {
    font-size: 12px;
    color: #999;
    margin-top: 4px;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }
  /* 详情弹窗 */
  .detail-modal .modal {
    max-width: 600px;
    padding: 0;
    overflow: hidden;
  }
  .detail-header {
    position: relative;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 30px;
    color: white;
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .detail-header img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.4);
    object-fit: cover;
    background: white;
    flex-shrink: 0;
  }
  .detail-header-info {
    flex: 1;
    min-width: 0;
  }
  .detail-header-info h2 {
    color: white;
    margin-bottom: 8px;
    font-size: 26px;
  }
  .detail-subtitle {
    font-size: 15px;
    opacity: 0.9;
    margin-bottom: 6px;
  }
  .detail-close {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(255,255,255,0.2);
    color: white;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .detail-close:hover { background: rgba(255,255,255,0.35); }
  .detail-body {
    padding: 25px 30px;
  }
  .detail-section {
    margin-bottom: 18px;
  }
  .detail-section-title {
    font-size: 13px;
    color: #888;
    margin-bottom: 8px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .detail-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 20px;
  }
  .detail-info-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #f7f8fc;
    border-radius: 8px;
    font-size: 14px;
  }
  .detail-info-item .info-icon {
    font-size: 16px;
  }
  .detail-info-item .info-label {
    color: #888;
    font-size: 12px;
  }
  .detail-info-item .info-value {
    color: #333;
    font-weight: 500;
    word-break: break-all;
  }
  .detail-info-item a {
    color: #667eea;
    text-decoration: none;
  }
  .detail-info-item a:hover {
    text-decoration: underline;
  }
  .detail-bio {
    background: #f7f8fc;
    border-radius: 8px;
    padding: 12px 15px;
    color: #444;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  .detail-body .admin-detail-actions {
    display: none;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #eee;
    gap: 10px;
    justify-content: flex-end;
  }
  body.admin-mode .detail-body .admin-detail-actions { display: flex; }
  .card .detail-click {
    cursor: pointer;
  }
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    z-index: 2000;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: #27ae60; }
  .toast.error { background: #e74c3c; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>👤 人员展示</h1>
    <div class="header-actions">
      <button class="btn btn-secondary" id="adminToggleBtn" onclick="toggleAdmin()">管理员登录</button>
    </div>
  </header>

  <div class="admin-panel" id="adminPanel">
    <div class="panel-title">⚙️ 管理模式已开启</div>
    <div style="margin-bottom:10px; padding:8px 12px; background:#fff3cd; border-left:4px solid #ffc107; border-radius:6px; font-size:13px; color:#856404; line-height:1.6;">
      提示：增删改后需要点"导出 data.json"，将下载的文件替换网站目录中的同名文件并重新部署，其他人才会看到更新。
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-success" onclick="openAddModal()">➕ 添加人员</button>
      <button class="btn btn-warning" onclick="exportDataJson()">📥 导出 data.json</button>
      <button class="btn btn-secondary" onclick="resetLocalToServer()">🔄 刷新服务器数据</button>
      <button class="btn btn-secondary" onclick="logoutAdmin()">退出管理员</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" class="search-box" id="searchBox" placeholder="🔍 搜索人员姓名..." oninput="renderGrid()">
  </div>

  <div class="grid" id="peopleGrid"></div>
</div>

<!-- 添加/编辑模态框 -->
<div class="modal-overlay" id="personModal">
  <div class="modal">
    <h2 id="modalTitle">添加人员</h2>
    <input type="hidden" id="personId">
    <div class="form-group">
      <label>姓名 *</label>
      <input type="text" id="personName" placeholder="请输入姓名">
    </div>
    <div class="form-group">
      <label>图片来源 *</label>
      <div style="display:flex; gap:20px; margin-bottom:10px; flex-wrap:wrap;">
        <label style="display:flex; align-items:center; gap:6px; font-weight:normal; cursor:pointer;">
          <input type="radio" name="imgSource" value="path" checked onchange="switchImgSource()"> 本地/网络图片
        </label>
        <label style="display:flex; align-items:center; gap:6px; font-weight:normal; cursor:pointer;">
          <input type="radio" name="imgSource" value="qq" onchange="switchImgSource()"> QQ头像（实时）
        </label>
      </div>
      <div id="imgPathBox">
        <input type="text" id="personImage" placeholder="例如：images/zhangsan.jpg">
        <div class="hint">把图片放到项目文件夹中，然后填写路径。也支持完整URL（http://...）</div>
      </div>
      <div id="imgQQBox" style="display:none;">
        <input type="text" id="personQQ" placeholder="请输入QQ号" oninput="previewQQ()">
        <div class="hint">填写QQ号后将自动获取该QQ的实时头像（QQ头像更换后自动同步）</div>
        <div style="margin-top:10px; display:flex; align-items:center; gap:12px;">
          <img id="qqPreview" style="display:none; width:80px; height:80px; border-radius:8px; object-fit:cover; border:2px solid #ddd;" alt="预览">
          <span id="qqTip" style="display:none; color:#27ae60; font-size:13px;">✓ 已获取头像</span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>职位（卡片上显示的副标题）</label>
      <input type="text" id="personDesc" placeholder="例如：产品经理 / 技术部">
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div class="form-group">
        <label>📞 电话</label>
        <input type="text" id="personPhone" placeholder="选填">
      </div>
      <div class="form-group">
        <label>📧 邮箱</label>
        <input type="email" id="personEmail" placeholder="选填">
      </div>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div class="form-group">
        <label>💬 微信</label>
        <input type="text" id="personWechat" placeholder="选填">
      </div>
      <div class="form-group">
        <label>🐧 QQ号</label>
        <input type="text" id="personQQContact" placeholder="选填，用于联系方式，与头像QQ无关">
      </div>
    </div>
    <div class="form-group">
      <label>📝 详细介绍</label>
      <textarea id="personBio" rows="4" placeholder="选填，个人简介、备注等"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-success" onclick="savePerson()">保存</button>
    </div>
  </div>
</div>

<!-- 管理员登录模态框 -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <h2>管理员登录</h2>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="adminPassword" placeholder="请输入管理员密码" onkeypress="if(event.key==='Enter') doLogin()">
      <div class="hint">默认密码：admin123（请登录后修改）</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeLoginModal()">取消</button>
      <button class="btn btn-success" onclick="doLogin()">登录</button>
    </div>
  </div>
</div>

<!-- 修改密码模态框 -->
<div class="modal-overlay" id="passwordModal">
  <div class="modal">
    <h2>修改管理员密码</h2>
    <div class="form-group">
      <label>原密码</label>
      <input type="password" id="oldPwd" placeholder="请输入原密码">
    </div>
    <div class="form-group">
      <label>新密码</label>
      <input type="password" id="newPwd" placeholder="请输入新密码">
    </div>
    <div class="form-group">
      <label>确认新密码</label>
      <input type="password" id="confirmPwd" placeholder="请再次输入新密码">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closePasswordModal()">取消</button>
      <button class="btn btn-warning" onclick="changePassword()">确认修改</button>
    </div>
  </div>
</div>

<!-- 人员详情弹窗 -->
<div class="modal-overlay detail-modal" id="detailModal">
  <div class="modal">
    <div class="detail-header">
      <button class="detail-close" onclick="closeDetail()">✕</button>
      <img id="detailImg" src="" alt="">
      <div class="detail-header-info">
        <h2 id="detailName"></h2>
        <div class="detail-subtitle" id="detailDesc"></div>
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-section" id="detailContactSection" style="display:none;">
        <div class="detail-section-title">联系方式</div>
        <div class="detail-info-grid" id="detailContactGrid"></div>
      </div>
      <div class="detail-section" id="detailBioSection" style="display:none;">
        <div class="detail-section-title">个人简介</div>
        <div class="detail-bio" id="detailBio"></div>
      </div>
      <div class="admin-detail-actions" id="detailAdminActions">
        <button class="btn btn-warning" onclick="editFromDetail()">✏️ 编辑</button>
        <button class="btn btn-danger" onclick="deleteFromDetail()">🗑️ 删除</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var STORAGE_KEY = 'people_data_v1';
  var PWD_KEY = 'admin_pwd_v1';
  var DEFAULT_PWD = 'admin123';

  var PEOPLE_DATA = []; // 全局内存中的数据（来自 data.json 或 localStorage）

  // 初始化：加载 data.json
  function loadDataFromJson(callback) {
    // 加时间戳避免缓存
    var url = 'data.json?t=' + new Date().getTime();
    if (typeof fetch === 'function') {
      fetch(url, { cache: 'no-store' })
        .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function(arr) {
          PEOPLE_DATA = arr || [];
          // 如果 localStorage 有更新版本（管理员改过），优先用本地修改版
          var localRaw = localStorage.getItem(STORAGE_KEY);
          if (localRaw) {
            try {
              var localArr = JSON.parse(localRaw);
              if (Array.isArray(localArr) && localArr.length > 0) {
                PEOPLE_DATA = localArr;
              }
            } catch (e) {}
          }
          callback(true);
        })
        .catch(function() {
          // fetch 失败（file:// 协议下可能被浏览器拦截），降级用 localStorage
          var raw = localStorage.getItem(STORAGE_KEY);
          PEOPLE_DATA = raw ? (function(){try{return JSON.parse(raw)}catch(e){return []}})() : [];
          callback(false);
        });
    } else {
      // 老浏览器无 fetch，用 XMLHttpRequest
      var xhr = new XMLHttpRequest();
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 0 || xhr.status === 200) {
            try {
              PEOPLE_DATA = JSON.parse(xhr.responseText) || [];
              var localRaw = localStorage.getItem(STORAGE_KEY);
              if (localRaw) {
                try {
                  var localArr = JSON.parse(localRaw);
                  if (Array.isArray(localArr) && localArr.length > 0) PEOPLE_DATA = localArr;
                } catch (e) {}
              }
              callback(true);
              return;
            } catch (e) {}
          }
          var raw = localStorage.getItem(STORAGE_KEY);
          PEOPLE_DATA = raw ? (function(){try{return JSON.parse(raw)}catch(e){return []}})() : [];
          callback(false);
        }
      };
      try {
        xhr.open('GET', url, true);
        xhr.send();
      } catch (e) {
        var raw = localStorage.getItem(STORAGE_KEY);
        PEOPLE_DATA = raw ? (function(){try{return JSON.parse(raw)}catch(e){return []}})() : [];
        callback(false);
      }
    }
  }

  function getData() {
    return PEOPLE_DATA || [];
  }
  function saveData(arr) {
    PEOPLE_DATA = arr;
    // 同时写入 localStorage 作为本地缓冲区
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch (e) {}
  }

  // 导出 data.json 文件供重新部署
  function exportDataJson() {
    var dataStr = JSON.stringify(getData(), null, 2);
    var blob;
    try {
      blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
    } catch (e) {
      // 兼容老浏览器：用 BlobBuilder
      var BB = window.BlobBuilder || window.WebKitBlobBuilder || window.MozBlobBuilder;
      var builder = new BB();
      builder.append(dataStr);
      blob = builder.getBlob('application/json;charset=utf-8');
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'data.json';
    document.body.appendChild(a);
    if (a.click) {
      a.click();
    } else {
      var evt = document.createEvent('MouseEvents');
      evt.initMouseEvent('click', true, true, window, 0, 0, 0, 0, 0, false, false, false, false, 0, null);
      a.dispatchEvent(evt);
    }
    setTimeout(function() {
      document.body.removeChild(a);
      try { URL.revokeObjectURL(url); } catch (e) {}
    }, 1000);
    showToast('已导出 data.json，请用它替换网站上的同名文件', 'success');
  }

  function resetLocalToServer() {
    if (!confirm('确定要放弃本地所有修改，重新加载服务器上的 data.json 吗？')) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    loadDataFromJson(function() {
      renderGrid();
      showToast('已重新加载服务器数据', 'success');
    });
  }

  function getPwd() {
    try { return localStorage.getItem(PWD_KEY) || DEFAULT_PWD; }
    catch (e) { return DEFAULT_PWD; }
  }
  function setPwd(p) {
    try { localStorage.setItem(PWD_KEY, p); } catch (e) {}
  }

  function isAdmin() {
    try { return sessionStorage.getItem('is_admin') === '1'; }
    catch (e) { return false; }
  }
  function setAdmin(v) {
    try {
      if (v) sessionStorage.setItem('is_admin', '1');
      else sessionStorage.removeItem('is_admin');
    } catch (e) {}
  }

  // Toast 提示
  function showToast(msg, type='') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast ' + type, 2000);
  }

  // 渲染人员列表
  function renderGrid() {
    const data = getData();
    const keyword = document.getElementById('searchBox').value.trim().toLowerCase();
    const filtered = data.filter(p => p.name.toLowerCase().includes(keyword));
    const grid = document.getElementById('peopleGrid');

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <h3>${data.length === 0 ? '暂无人员数据' : '未找到匹配的人员'}</h3>
        <p>${isAdmin() ? '点击右上角"添加人员"来创建' : ''}</p>
      </div>`;
      return;
    }

    grid.innerHTML = filtered.map(p => {
      const imgSrc = getImgSrc(p.image);
      return `
      <div class="card">
        <div class="actions" onclick="event.stopPropagation()">
          <button class="edit-btn" onclick="openEditModal('${p.id}')" title="编辑">✏️</button>
          <button class="delete-btn" onclick="deletePerson('${p.id}')" title="删除">🗑️</button>
        </div>
        <div class="detail-click" onclick="openDetail('${p.id}')">
          <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(p.name)}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22240%22><rect width=%22300%22 height=%22240%22 fill=%22%23f0f0f0%22/><text x=%22150%22 y=%22130%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22%23999%22>无图片</text></svg>'">
          <div class="info">
            <div class="name">${escapeHtml(p.name)}</div>
            ${p.desc ? `<div class="desc">${escapeHtml(p.desc)}</div>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  // 将存储的图片字段转换为实际可显示的 src
  // 支持格式：qq:12345678（QQ实时头像）、普通路径或URL
  function getImgSrc(src) {
    if (!src) return '';
    if (src.startsWith('qq:')) {
      const qq = src.substring(3);
      // 加时间戳防止浏览器缓存，确保每次都拿到最新头像
      return `https://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(qq)}&s=640&t=${Date.now()}`;
    }
    return src;
  }

  // 切换图片来源（本地/网络 vs QQ头像）
  function switchImgSource() {
    const val = document.querySelector('input[name="imgSource"]:checked').value;
    document.getElementById('imgPathBox').style.display = val === 'path' ? 'block' : 'none';
    document.getElementById('imgQQBox').style.display = val === 'qq' ? 'block' : 'none';
  }

  // 实时预览QQ头像
  function previewQQ() {
    const qq = document.getElementById('personQQ').value.trim();
    const img = document.getElementById('qqPreview');
    const tip = document.getElementById('qqTip');
    if (/^\d{4,12}$/.test(qq)) {
      img.src = `https://q1.qlogo.cn/g?b=qq&nk=${qq}&s=640`;
      img.style.display = 'block';
      tip.style.display = 'inline';
      img.onerror = () => {
        img.style.display = 'none';
        tip.style.display = 'none';
      };
    } else {
      img.style.display = 'none';
      tip.style.display = 'none';
    }
  }

  // 管理员登录/退出
  function toggleAdmin() {
    if (isAdmin()) {
      // 已登录 → 打开修改密码
      openPasswordModal();
    } else {
      openLoginModal();
    }
  }
  function openLoginModal() {
    document.getElementById('loginModal').classList.add('active');
    document.getElementById('adminPassword').value = '';
    setTimeout(() => document.getElementById('adminPassword').focus(), 100);
  }
  function closeLoginModal() {
    document.getElementById('loginModal').classList.remove('active');
  }
  function doLogin() {
    const pwd = document.getElementById('adminPassword').value;
    if (pwd === getPwd()) {
      setAdmin(true);
      closeLoginModal();
      updateAdminUI();
      showToast('登录成功', 'success');
    } else {
      showToast('密码错误', 'error');
    }
  }
  function logoutAdmin() {
    setAdmin(false);
    updateAdminUI();
    showToast('已退出管理员', 'success');
  }
  function updateAdminUI() {
    const btn = document.getElementById('adminToggleBtn');
    const panel = document.getElementById('adminPanel');
    if (isAdmin()) {
      document.body.classList.add('admin-mode');
      btn.textContent = '修改密码';
      btn.className = 'btn btn-warning';
      panel.classList.add('active');
    } else {
      document.body.classList.remove('admin-mode');
      btn.textContent = '管理员登录';
      btn.className = 'btn btn-secondary';
      panel.classList.remove('active');
    }
    renderGrid();
  }

  // 修改密码
  function openPasswordModal() {
    document.getElementById('passwordModal').classList.add('active');
    ['oldPwd','newPwd','confirmPwd'].forEach(id => document.getElementById(id).value = '');
  }
  function closePasswordModal() {
    document.getElementById('passwordModal').classList.remove('active');
  }
  function changePassword() {
    const oldP = document.getElementById('oldPwd').value;
    const newP = document.getElementById('newPwd').value;
    const conP = document.getElementById('confirmPwd').value;
    if (oldP !== getPwd()) { showToast('原密码错误', 'error'); return; }
    if (newP.length < 6) { showToast('新密码至少6位', 'error'); return; }
    if (newP !== conP) { showToast('两次密码不一致', 'error'); return; }
    setPwd(newP);
    closePasswordModal();
    showToast('密码修改成功', 'success');
  }

  // 添加/编辑人员
  function openAddModal() {
    document.getElementById('modalTitle').textContent = '添加人员';
    document.getElementById('personId').value = '';
    document.getElementById('personName').value = '';
    document.getElementById('personImage').value = '';
    document.getElementById('personQQ').value = '';
    document.getElementById('personDesc').value = '';
    document.getElementById('personPhone').value = '';
    document.getElementById('personEmail').value = '';
    document.getElementById('personWechat').value = '';
    document.getElementById('personQQContact').value = '';
    document.getElementById('personBio').value = '';
    document.querySelector('input[name="imgSource"][value="path"]').checked = true;
    switchImgSource();
    document.getElementById('qqPreview').style.display = 'none';
    document.getElementById('qqTip').style.display = 'none';
    document.getElementById('personModal').classList.add('active');
    setTimeout(() => document.getElementById('personName').focus(), 100);
  }
  function openEditModal(id) {
    const data = getData();
    const p = data.find(x => x.id === id);
    if (!p) return;
    document.getElementById('modalTitle').textContent = '编辑人员';
    document.getElementById('personId').value = p.id;
    document.getElementById('personName').value = p.name;
    document.getElementById('personDesc').value = p.desc || '';
    document.getElementById('personPhone').value = p.phone || '';
    document.getElementById('personEmail').value = p.email || '';
    document.getElementById('personWechat').value = p.wechat || '';
    document.getElementById('personQQContact').value = p.qqcontact || '';
    document.getElementById('personBio').value = p.bio || '';

    if (p.image && p.image.startsWith('qq:')) {
      document.querySelector('input[name="imgSource"][value="qq"]').checked = true;
      document.getElementById('personImage').value = '';
      document.getElementById('personQQ').value = p.image.substring(3);
      previewQQ();
    } else {
      document.querySelector('input[name="imgSource"][value="path"]').checked = true;
      document.getElementById('personImage').value = p.image || '';
      document.getElementById('personQQ').value = '';
      document.getElementById('qqPreview').style.display = 'none';
      document.getElementById('qqTip').style.display = 'none';
    }
    switchImgSource();
    document.getElementById('personModal').classList.add('active');
  }
  function closeModal() {
    document.getElementById('personModal').classList.remove('active');
  }
  function savePerson() {
    const id = document.getElementById('personId').value;
    const name = document.getElementById('personName').value.trim();
    const desc = document.getElementById('personDesc').value.trim();
    const phone = document.getElementById('personPhone').value.trim();
    const email = document.getElementById('personEmail').value.trim();
    const wechat = document.getElementById('personWechat').value.trim();
    const qqcontact = document.getElementById('personQQContact').value.trim();
    const bio = document.getElementById('personBio').value.trim();
    const source = document.querySelector('input[name="imgSource"]:checked').value;

    let image = '';
    if (source === 'qq') {
      const qq = document.getElementById('personQQ').value.trim();
      if (!/^\d{4,12}$/.test(qq)) { showToast('请输入正确的QQ号（4-12位数字）', 'error'); return; }
      image = 'qq:' + qq;
    } else {
      image = document.getElementById('personImage').value.trim();
      if (!image) { showToast('请填写图片路径', 'error'); return; }
    }

    if (!name) { showToast('请填写姓名', 'error'); return; }

    const payload = { name, image, desc, phone, email, wechat, qqcontact, bio };
    const data = getData();
    if (id) {
      const idx = data.findIndex(x => x.id === id);
      if (idx >= 0) {
        data[idx] = { ...data[idx], ...payload };
      }
    } else {
      data.push({ id: Date.now().toString() + Math.random().toString(36).slice(2,6), ...payload });
    }
    saveData(data);
    closeModal();
    renderGrid();
    // 如果详情窗打开着，刷新它
    if (currentDetailId) openDetail(currentDetailId);
    showToast('保存成功', 'success');
  }
  function deletePerson(id) {
    if (!confirm('确定要删除这个人员吗？')) return;
    const data = getData().filter(x => x.id !== id);
    saveData(data);
    if (currentDetailId === id) { closeDetail(); }
    renderGrid();
    showToast('已删除', 'success');
  }

  // ===== 详情弹窗 =====
  let currentDetailId = null;

  function openDetail(id) {
    const p = getData().find(x => x.id === id);
    if (!p) return;
    currentDetailId = id;

    const imgSrc = getImgSrc(p.image);
    document.getElementById('detailImg').src = imgSrc;
    document.getElementById('detailImg').onerror = function() {
      this.src = 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%23f0f0f0%22/><text x=%22100%22 y=%22110%22 font-size=%2224%22 text-anchor=%22middle%22 fill=%22%23999%22>无图</text></svg>';
    };
    document.getElementById('detailName').textContent = p.name || '';
    document.getElementById('detailDesc').textContent = p.desc || '';

    // 联系方式
    const contacts = [];
    if (p.phone) contacts.push({ icon: '📞', label: '电话', value: p.phone, link: 'tel:' + p.phone });
    if (p.email) contacts.push({ icon: '📧', label: '邮箱', value: p.email, link: 'mailto:' + p.email });
    if (p.wechat) contacts.push({ icon: '💬', label: '微信', value: p.wechat, copy: true });
    if (p.qqcontact) contacts.push({ icon: '🐧', label: 'QQ', value: p.qqcontact, copy: true });
    const contactSection = document.getElementById('detailContactSection');
    const contactGrid = document.getElementById('detailContactGrid');
    if (contacts.length > 0) {
      contactSection.style.display = 'block';
      contactGrid.innerHTML = contacts.map(c => `
        <div class="detail-info-item" title="${c.copy ? '点击复制' : ''}" ${c.copy ? `onclick="copyText('${escapeHtml(c.value)}')" style="cursor:pointer;"` : ''}>
          <span class="info-icon">${c.icon}</span>
          <div>
            <div class="info-label">${c.label}</div>
            <div class="info-value">
              ${c.link ? `<a href="${escapeHtml(c.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escapeHtml(c.value)}</a>` : escapeHtml(c.value)}
              ${c.copy ? ' <small style="color:#999;font-size:11px;">(点击复制)</small>' : ''}
            </div>
          </div>
        </div>
      `).join('');
    } else {
      contactSection.style.display = 'none';
    }

    // 简介
    const bioSection = document.getElementById('detailBioSection');
    const bioEl = document.getElementById('detailBio');
    if (p.bio && p.bio.trim()) {
      bioSection.style.display = 'block';
      bioEl.textContent = p.bio;
    } else {
      bioSection.style.display = 'none';
    }

    document.getElementById('detailModal').classList.add('active');
  }

  function closeDetail() {
    document.getElementById('detailModal').classList.remove('active');
    currentDetailId = null;
  }

  function editFromDetail() {
    if (!currentDetailId) return;
    closeDetail();
    setTimeout(() => openEditModal(currentDetailId), 200);
  }

  function deleteFromDetail() {
    if (!currentDetailId) return;
    deletePerson(currentDetailId);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制：' + text, 'success');
      }).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('已复制：' + text, 'success'); }
    catch (e) { showToast('复制失败', 'error'); }
    document.body.removeChild(ta);
  }

  // 点击遮罩关闭
  var overlays = document.querySelectorAll('.modal-overlay');
  for (var i = 0; i < overlays.length; i++) {
    overlays[i].addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('active');
    });
  }
  // ESC 键关闭所有弹窗
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      var ms = document.querySelectorAll('.modal-overlay.active');
      for (var j = 0; j < ms.length; j++) ms[j].classList.remove('active');
    }
  });

  // 初始化：加载数据后再渲染
  updateAdminUI();
  loadDataFromJson(function(ok) {
    renderGrid();
    if (!ok && getData().length === 0) {
      // 既不能 fetch data.json，本地也空 → 提示用户（file:// 双击打开时常见）
      showToast('提示：请通过启动服务器或部署到网站访问，直接双击可能无法读取数据', '');
    }
  });
</script>
</body>
</html>
