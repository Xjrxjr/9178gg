<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人员展示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0d47a1 0%, #1565c0 50%, #1976d2 100%);
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }
  /* 背景中间大 LSPD 徽章水印（已隐藏） */
  body::before {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 500px;
    height: 580px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 580'><defs><filter id='glow'><feGaussianBlur stdDeviation='4'/></filter></defs><path d='M250 30 L420 90 L420 260 Q420 420 250 540 Q80 420 80 260 L80 90 Z' fill='none' stroke='%23ffd700' stroke-width='5' opacity='0.15'/><path d='M250 50 L400 100 L400 260 Q400 400 250 510 Q100 400 100 260 L100 100 Z' fill='%230d3d8a' opacity='0.12' stroke='%23ffd700' stroke-width='3' stroke-opacity='0.2'/><circle cx='250' cy='220' r='90' fill='none' stroke='%23ffd700' stroke-width='4' opacity='0.18'/><polygon points='250,140 270,200 250,260 230,200' fill='%23ffd700' opacity='0.15'/><path d='M180 220 Q180 170 220 170 L280 170 Q320 170 320 220 Q320 270 280 280 L220 280 Q180 270 180 220 Z' fill='none' stroke='%23ffd700' stroke-width='3' opacity='0.18'/><text x='250' y='350' text-anchor='middle' fill='%23ffd700' font-size='56' font-family='Arial' font-weight='bold' letter-spacing='8' opacity='0.18'>LSPD</text><text x='250' y='395' text-anchor='middle' fill='white' font-size='20' font-family='Arial' letter-spacing='6' opacity='0.12'>LOS SANTOS</text><text x='250' y='425' text-anchor='middle' fill='white' font-size='20' font-family='Arial' letter-spacing='6' opacity='0.12'>POLICE DEPT</text><text x='250' y='470' text-anchor='middle' fill='%23ffd700' font-size='16' font-family='Arial' letter-spacing='4' opacity='0.12'>TO PROTECT AND SERVE</text></svg>");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    pointer-events: none;
    z-index: 0;
    display: none;
  }
  .container { position: relative; z-index: 1; }
  .container {
    max-width: 1200px;
    margin: 0 auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.95);
    padding: 20px 30px;
    border-radius: 12px;
    margin-bottom: 30px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  }
  header h1 {
    color: #333;
    font-size: 26px;
  }
  /* 团队标题区域（返回按钮+团队名） */
  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .back-btn {
    background: #ffd700;
    color: #0d47a1;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    display: none;
    transition: all 0.2s;
  }
  .back-btn:hover { background: #ffc107; transform: translateX(-2px); }
  .back-btn.show { display: inline-flex; align-items: center; gap: 6px; }
  .team-title-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    background: rgba(255,215,0,0.15);
    border-left: 4px solid #ffd700;
    border-radius: 8px;
    margin-bottom: 20px;
    color: white;
    font-size: 15px;
    display: none;
  }
  .team-title-bar.show { display: flex; }
  .team-title-bar .tt-icon { font-size: 28px; }
  .team-title-bar .tt-name { font-size: 22px; font-weight: bold; color: #fff; }
  .team-title-bar .tt-en { font-size: 12px; opacity: 0.85; }
  .team-title-bar .tt-count {
    margin-left: auto;
    background: rgba(255,255,255,0.2);
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: bold;
  }
  /* 团队选择页样式 */
  .teams-view {
    display: none;
  }
  .teams-view.show { display: block; }
  .teams-subtitle {
    text-align: center;
    color: rgba(255,255,255,0.9);
    font-size: 15px;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }
  .teams-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    margin: 0 auto;
    max-width: 960px;
  }
  .team-card {
    background: white;
    border-radius: 16px;
    padding: 28px 20px 22px 20px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    border-top: 6px solid;
    width: 100%;
    height: 340px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
  .team-card::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 80px; height: 80px;
    border-radius: 0 0 0 100%;
    opacity: 0.08;
  }
  .team-card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 16px 40px rgba(0,0,0,0.28);
  }
  .team-card .tc-icon {
    font-size: 52px;
    margin-bottom: 14px;
    display: block;
    flex-shrink: 0;
  }
  .team-card .tc-name {
    font-size: 22px;
    font-weight: bold;
    color: #222;
    margin-bottom: 6px;
    min-height: 28px;
    line-height: 1.3;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .team-card .tc-en {
    font-size: 11px;
    letter-spacing: 1.5px;
    opacity: 0.6;
    margin-bottom: 6px;
    text-transform: uppercase;
    min-height: 14px;
    flex-shrink: 0;
  }
  .team-card .tc-count {
    display: inline-block;
    background: #f0f4f8;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    color: #555;
    font-weight: bold;
    margin-top: auto;
    flex-shrink: 0;
  }
  .recruit-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-top: 10px;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s;
    border: 1.5px dashed transparent;
  }
  .recruit-badge:hover { transform: scale(1.04); }
  .recruit-on  { background: rgba(46, 125, 50, 0.15); color: #2e7d32; border-color: #2e7d32; border-style: solid; }
  .recruit-off { background: rgba(211, 47, 47, 0.12); color: #c62828; border-color: #c62828; border-style: solid; }
  .recruit-null { background: rgba(158, 158, 158, 0.12); color: #757575; border-color: #bdbdbd; }
  .recruit-hint { font-size: 11px; opacity: 0.75; margin-top: 6px; }
  /* 人员列表页显示切换 */
  #peopleGridWrapper { display: none; }
  #peopleGridWrapper.show { display: block; }
  /* 屏保：瓦格纳 */
  #screensaver {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: radial-gradient(ellipse at center, #1a1a1a 0%, #000000 100%);
    z-index: 9999;
    display: none;
    cursor: pointer;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #d4af37;
    text-align: center;
    animation: ssFadeIn 0.6s ease;
  }
  #screensaver.show { display: flex; }
  @keyframes ssFadeIn { from { opacity: 0; } to { opacity: 1; } }
  #screensaver .ss-hammer {
    display: none;
  }
  @keyframes ssPulse {
    0%,100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.06); opacity: 1; }
  }
  #screensaver .ss-title {
    font-size: 72px;
    font-weight: bold;
    letter-spacing: 18px;
    color: #d4af37;
    text-shadow: 0 0 30px rgba(212,175,55,0.6);
    margin-bottom: 14px;
  }
  #screensaver .ss-logo {
    width: 280px;
    height: auto;
    margin-bottom: 20px;
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(212,175,55,0.4);
    animation: ssPulse 3s ease-in-out infinite;
  }
  #screensaver .ss-en {
    font-size: 18px;
    letter-spacing: 8px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 36px;
  }
  #screensaver .ss-alt-badge {
    display: inline-block;
    border: 1.5px solid #d4af37;
    color: #d4af37;
    padding: 6px 24px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 6px;
    margin-bottom: 30px;
  }
  #screensaver .ss-text-line {
    font-size: 20px;
    color: rgba(255,255,255,0.75);
    letter-spacing: 3px;
    margin-bottom: 14px;
  }
  #screensaver .ss-hint {
    font-size: 14px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 2px;
    margin-top: 24px;
    animation: ssBlink 1.8s ease-in-out infinite;
  }
  @keyframes ssBlink {
    0%,100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }
  .header-actions {
    display: flex;
    gap: 12px;
  }
  .btn {
    background: #1565c0;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .btn:hover { background: #5568d3; transform: translateY(-1px); }
  .btn-danger { background: #e74c3c; }
  .btn-danger:hover { background: #c0392b; }
  .btn-success { background: #27ae60; }
  .btn-success:hover { background: #219653; }
  .btn-secondary { background: #95a5a6; }
  .btn-secondary:hover { background: #7f8c8d; }
  .btn-warning { background: #f39c12; }
  .btn-warning:hover { background: #d68910; }
  .btn:disabled { background: #bdc3c7; cursor: not-allowed; transform: none; }


  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
  }
  .card {
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
  .card img {
    width: 100%;
    height: 80px;
    object-fit: cover;
    background: #f0f0f0;
    display: block;
  }
  .card .info {
    padding: 6px;
    text-align: center;
  }
  .card .name {
    font-size: 13px;
    font-weight: bold;
    color: #333;
    margin-bottom: 2px;
  }
  .card .desc {
    font-size: 10px;
    color: #777;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: white;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
  }
  .empty-state h3 { font-size: 20px; margin-bottom: 10px; }

  /* 模态框 */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white;
    padding: 30px;
    border-radius: 12px;
    width: 90%;
    max-width: 450px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal h2 {
    color: #333;
    margin-bottom: 20px;
    font-size: 22px;
  }
  .form-group {
    margin-bottom: 15px;
  }
  .form-group label {
    display: block;
    margin-bottom: 6px;
    color: #555;
    font-size: 14px;
    font-weight: 600;
  }
  .form-group input, .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .form-group input:focus, .form-group textarea:focus {
    outline: none;
    border-color: #1565c0;
  }
  .form-group .hint {
    font-size: 12px;
    color: #999;
    margin-top: 4px;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }
  /* 详情弹窗 */
  .detail-modal .modal {
    max-width: 600px;
    padding: 0;
    overflow: hidden;
  }
  .detail-header {
    position: relative;
    background: linear-gradient(135deg, #0d47a1 0%, #1565c0 50%, #1976d2 100%);
    padding: 30px;
    color: white;
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .detail-header img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.4);
    object-fit: cover;
    background: white;
    flex-shrink: 0;
  }
  .detail-header-info {
    flex: 1;
    min-width: 0;
  }
  .detail-header-info h2 {
    color: white;
    margin-bottom: 8px;
    font-size: 26px;
  }
  .detail-subtitle {
    font-size: 15px;
    color: white;
    opacity: 0.9;
    margin-bottom: 6px;
  }
  .detail-close {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(255,255,255,0.2);
    color: white;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .detail-close:hover { background: rgba(255,255,255,0.35); }
  .detail-body {
    padding: 25px 30px;
  }
  .detail-section {
    margin-bottom: 18px;
  }
  .detail-section-title {
    font-size: 13px;
    color: #888;
    margin-bottom: 8px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .detail-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 20px;
  }
  .detail-info-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #f7f8fc;
    border-radius: 8px;
    font-size: 14px;
  }
  .detail-info-item .info-icon {
    font-size: 16px;
  }
  .detail-info-item .info-label {
    color: #888;
    font-size: 12px;
  }
  .detail-info-item .info-value {
    color: #333;
    font-weight: 500;
    word-break: break-all;
  }
  .detail-info-item a {
    color: #1565c0;
    text-decoration: none;
  }
  .detail-info-item a:hover {
    text-decoration: underline;
  }
  .detail-bio {
    background: #f7f8fc;
    border-radius: 8px;
    padding: 12px 15px;
    color: #444;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  .card .detail-click {
    cursor: pointer;
  }
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    z-index: 2000;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: #27ae60; }
  .toast.error { background: #e74c3c; }
</style>
</head>

<script>
  var STORAGE_KEY = 'people_data_v2'; // v2：支持 team 字段，自动清除 v1 旧数据
  var TEAM_RECRUIT_KEY = 'team_recruit_v1';
  function getRecruitMap() {
    try {
      var raw = localStorage.getItem(TEAM_RECRUIT_KEY);
      if (!raw) return {};
      var obj = JSON.parse(raw);
      return obj && typeof obj === 'object' ? obj : {};
    } catch (e) { return {}; }
  }
  function setRecruitMap(map) {
    try { localStorage.setItem(TEAM_RECRUIT_KEY, JSON.stringify(map || {})); } catch (e) {}
  }
  function getRecruit(teamId) {
    var m = getRecruitMap();
    var v = m[String(teamId)];
    return v === true || v === false ? v : null;
  }
  function getRecruitBadgeClass(teamId) {
    var r = getRecruit(teamId);
    if (r === true) return 'recruit-on';
    if (r === false) return 'recruit-off';
    return 'recruit-null';
  }
  function getRecruitBadgeText(teamId) {
    var r = getRecruit(teamId);
    if (r === true) return '🔵 招募中';
    if (r === false) return '⚪ 暂停招募';
    return '⭕ 是否招募未定';

  // 初始化：加载 data.json
  function loadDataFromJson(callback) {
    // 加时间戳避免缓存
    var url = 'data.json?t=' + new Date().getTime();
    if (typeof fetch === 'function') {
      fetch(url, { cache: 'no-store' })
        .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function(arr) {
          PEOPLE_DATA = arr || [];
          // 如果 localStorage 有更新版本（管理员改过），优先用本地修改版
          var localRaw = localStorage.getItem(STORAGE_KEY);
          if (localRaw) {
            try {
              var localArr = JSON.parse(localRaw);
              if (Array.isArray(localArr) && localArr.length > 0) {
                PEOPLE_DATA = localArr;
              }
            } catch (e) {}
          }
          callback(true);
        })
        .catch(function() {
          // fetch 失败（file:// 协议下可能被浏览器拦截），降级用 localStorage
          var raw = localStorage.getItem(STORAGE_KEY);
          PEOPLE_DATA = raw ? (function(){try{return JSON.parse(raw)}catch(e){return EMBEDDED_DATA}})() : EMBEDDED_DATA;
          callback(false);
        });
    } else {
      // 老浏览器无 fetch，用 XMLHttpRequest
      var xhr = new XMLHttpRequest();
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 0 || xhr.status === 200) {
            try {
              PEOPLE_DATA = JSON.parse(xhr.responseText) || [];
              var localRaw = localStorage.getItem(STORAGE_KEY);
              if (localRaw) {
                try {
                  var localArr = JSON.parse(localRaw);
                  if (Array.isArray(localArr) && localArr.length > 0) PEOPLE_DATA = localArr;
                } catch (e) {}
              }
              callback(true);
              return;
            } catch (e) {}
          }
          var raw = localStorage.getItem(STORAGE_KEY);
          PEOPLE_DATA = raw ? (function(){try{return JSON.parse(raw)}catch(e){return EMBEDDED_DATA}})() : EMBEDDED_DATA;
          callback(false);
        }
      };
      try {
        xhr.open('GET', url, true);
        xhr.send();
      } catch (e) {
        var raw = localStorage.getItem(STORAGE_KEY);
        PEOPLE_DATA = raw ? (function(){try{return JSON.parse(raw)}catch(e){return EMBEDDED_DATA}})() : EMBEDDED_DATA;
        callback(false);
      }
    }
  }

  function getData() {
    // 兼容新旧两套字段名（旧: role/description/avatar, 新: desc/bio/image）
    // 兼容 team 字段（无 team 则默认归到 1:LSPD）
    return (PEOPLE_DATA || []).map(function(p) {
      return Object.assign({}, p, {
        image: p.image !== undefined ? p.image : (p.avatar || ''),
        desc: p.desc || p.role || '',
        bio: p.bio || p.description || '',
        team: p.team || (p.team_id) || 1
      });
    });
  }
  function getTeamById(id) {
    var t = TEAMS.find(function(x){ return String(x.id) === String(id); });
    return t || { name: '未分配', icon: '❓', color: '#888', en: '' };
  }
  function saveData(arr) {
    PEOPLE_DATA = arr;
    // 同时写入 localStorage 作为本地缓冲区
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch (e) {}
  }

  // Toast 提示
  function showToast(msg, type='') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast ' + type, 2000);
  }

  // 渲染主视图（团队页 或 人员列表页）
  function renderView() {
    const teamsView = document.getElementById('teamsView');
    const peopleWrapper = document.getElementById('peopleGridWrapper');
    const backBtn = document.getElementById('backBtn');
    const titleBar = document.getElementById('teamTitleBar');

    if (CURRENT_TEAM === null) {
      // 团队选择页
      teamsView.classList.add('show');
      peopleWrapper.classList.remove('show');
      backBtn.classList.remove('show');
      renderTeams();
    } else {
      // 人员列表页
      teamsView.classList.remove('show');
      peopleWrapper.classList.add('show');
      backBtn.classList.add('show');
      const team = getTeamById(CURRENT_TEAM);
      const count = getData().filter(x => String(x.team) === String(CURRENT_TEAM)).length;
      titleBar.innerHTML = `<span class="tt-icon">${team.icon}</span><div><div class="tt-name">${team.name}</div><div class="tt-en">${team.en}</div></div><div class="tt-count">👥 ${count} 人</div>`;
      titleBar.classList.add('show');
      renderGrid();
    }
  }

  // 返回团队选择页
  function goBackToTeams() {
    CURRENT_TEAM = null;
    renderView();
  }

  // 进入某个团队
  function enterTeam(teamId) {
    var tm = getTeamById(teamId);
    var nm = String((tm && tm.name) || '').trim();
    if (nm === '' || nm === '未启用') {
      showToast('该团队未启用', 'error');
      return;
    }
    CURRENT_TEAM = Number(teamId);
    renderView();
  }

  // 渲染 8 个团队卡片

  // 部署后自动读取服务器上的 team_recruit.json（所有访客都能看到管理员设置的招募状态）
  (function loadServerRecruit() {
    try {
      if (typeof fetch !== 'function') return;
      fetch('team_recruit.json?t=' + new Date().getTime(), { cache: 'no-store' })
        .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function(obj) {
          if (!obj || typeof obj !== 'object') return;
          var local = getRecruitMap();
          var emptyLocal = Object.keys(local).length === 0;
          if (!emptyLocal) return; // 管理员本地已经有修改过的设置，不要被旧服务器文件覆盖
          setRecruitMap(obj);
          try { renderTeams(); } catch (e) {}
        })
        .catch(function() {});
    } catch (e) {}
  })();

  function renderTeams() {
    const grid = document.getElementById('teamsGrid');
    const allData = getData();
    grid.innerHTML = TEAMS.filter(function(t){ var n=String((t&&t.name)||'').trim(); return n && n!=='未启用'; }).map(function(t) {
      const count = allData.filter(function(x){ return String(x.team) === String(t.id); }).length;
      const isEmpty = !t.name || String(t.name).trim() === '未启用'; // 未命名或标记为未启用 = 禁用卡片
      if (isEmpty) {
        // 灰色"待启用"卡片，不可点击
        return `
        <div class="team-card" style="border-top-color:#bdbdbd; color:#999; cursor:not-allowed; opacity:0.55; background:#f5f5f5;">
          <div style="position:absolute; top:0; right:0; width:90px; height:90px; border-radius:0 0 0 100%; background:#9e9e9e; opacity:0.10;"></div>
          <span class="tc-icon">⬜</span>
          <div class="tc-name" style="color:#999;">待启用</div>
          <div class="tc-en">&nbsp;</div>
          <div class="tc-count" style="background:#eee; color:#999;">— —</div>
        </div>`;
      }
      return `
      <div class="team-card" style="border-top-color:${t.color}; color:${t.color};" onclick="enterTeam(${t.id})">
        <div style="position:absolute; top:0; right:0; width:90px; height:90px; border-radius:0 0 0 100%; background:${t.color}; opacity:0.10;"></div>
        <span class="tc-icon">${t.icon}</span>
        <div class="tc-name">${t.name}</div>
        <div class="tc-en">${t.en}</div>
        <div class="tc-count">👥 ${count} 人</div>
        <div class="recruit-badge ${getRecruitBadgeClass(t.id)}"
             title="招募状态">
          ${getRecruitBadgeText(t.id)}
        </div>
      </div>`;
    }).join('');
  }

  // 渲染人员列表（按 CURRENT_TEAM 过滤）
  function renderGrid() {
    const all = getData();
    const data = CURRENT_TEAM === null
      ? all
      : all.filter(function(x){ return String(x.team) === String(CURRENT_TEAM); });
    const grid = document.getElementById('peopleGrid');

    if (data.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <h3>暂无人员数据</h3>
      </div>`;
      return;
    }

    grid.innerHTML = data.map(p => {
      const imgSrc = getImgSrc(p.image);
      return `
      <div class="card">
        <div class="detail-click" onclick="openDetail('${p.id}')">
          <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(p.name)}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 110 80%22><rect width=%22110%22 height=%2280%22 rx=%228%22 fill=%22%231565c0%22/><path d=%22M55 8 L72 16 L72 32 Q72 50 55 64 Q38 50 38 32 L38 16 Z%22 fill=%22%230d47a1%22 stroke=%22%23ffd700%22 stroke-width=%222%22/><polygon points=%2255,20 58,28 55,36 52,28%22 fill=%22%23ffd700%22/><text x=%2255%22 y=%2276%22 text-anchor=%22middle%22 fill=%22%23ffd700%22 font-size=%229%22 font-family=%22Arial%22 font-weight=%22bold%22 letter-spacing=%221%22>LSPD</text></svg>'">
          <div class="info">
            <div class="name">${escapeHtml(p.name)}</div>
            ${p.desc ? `<div class="desc">${escapeHtml(p.desc)}</div>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  // 将存储的图片字段转换为实际可显示的 src
  // 支持格式：qq:12345678（QQ实时头像）、普通路径或URL
  function getImgSrc(src) {
    if (!src) return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 80"><rect width="110" height="80" rx="8" fill="%231565c0"/><path d="M55 8 L72 16 L72 32 Q72 50 55 64 Q38 50 38 32 L38 16 Z" fill="%230d47a1" stroke="%23ffd700" stroke-width="2"/><polygon points="55,20 58,28 55,36 52,28" fill="%23ffd700"/><text x="55" y="76" text-anchor="middle" fill="%23ffd700" font-size="9" font-family="Arial" font-weight="bold" letter-spacing="1">LSPD</text></svg>';
    if (src.startsWith('qq:')) {
      const qq = src.substring(3);
      // 加时间戳防止浏览器缓存，确保每次都拿到最新头像
      return `https://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(qq)}&s=640&t=${Date.now()}`;
    }
    return src;
  }

  // ===== 详情弹窗 =====
  let currentDetailId = null;

  function openDetail(id) {
    const p = getData().find(x => String(x.id) === String(id));
    if (!p) return;
    currentDetailId = id;

    const imgSrc = getImgSrc(p.image);
    document.getElementById('detailImg').src = imgSrc;
    document.getElementById('detailImg').onerror = function() {
      this.src = 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 110 80%22><rect width=%22110%22 height=%2280%22 rx=%228%22 fill=%22%231565c0%22/><path d=%22M55 8 L72 16 L72 32 Q72 50 55 64 Q38 50 38 32 L38 16 Z%22 fill=%22%230d47a1%22 stroke=%22%23ffd700%22 stroke-width=%222%22/><polygon points=%2255,20 58,28 55,36 52,28%22 fill=%22%23ffd700%22/><text x=%2255%22 y=%2276%22 text-anchor=%22middle%22 fill=%22%23ffd700%22 font-size=%229%22 font-family=%22Arial%22 font-weight=%22bold%22 letter-spacing=%221%22>LSPD</text></svg>';
    };
    document.getElementById('detailName').textContent = p.name || '';
    document.getElementById('detailDesc').textContent = p.desc || '';

    // 联系方式
    const contacts = [];
    if (p.phone) contacts.push({ icon: '📞', label: '电话', value: p.phone, link: 'tel:' + p.phone });
    if (p.email) contacts.push({ icon: '📧', label: '邮箱', value: p.email, link: 'mailto:' + p.email });
    if (p.wechat) contacts.push({ icon: '💬', label: '微信', value: p.wechat, copy: true });
    if (p.qqcontact) contacts.push({ icon: '🐧', label: 'QQ', value: p.qqcontact, copy: true });
    const contactSection = document.getElementById('detailContactSection');
    const contactGrid = document.getElementById('detailContactGrid');
    if (contacts.length > 0) {
      contactSection.style.display = 'block';
      contactGrid.innerHTML = contacts.map(c => `
        <div class="detail-info-item" title="${c.copy ? '点击复制' : ''}" ${c.copy ? `onclick="copyText('${escapeHtml(c.value)}')" style="cursor:pointer;"` : ''}>
          <span class="info-icon">${c.icon}</span>
          <div>
            <div class="info-label">${c.label}</div>
            <div class="info-value">
              ${c.link ? `<a href="${escapeHtml(c.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escapeHtml(c.value)}</a>` : escapeHtml(c.value)}
              ${c.copy ? ' <small style="color:#999;font-size:11px;">(点击复制)</small>' : ''}
            </div>
          </div>
        </div>
      `).join('');
    } else {
      contactSection.style.display = 'none';
    }

    // 简介
    const bioSection = document.getElementById('detailBioSection');
    const bioEl = document.getElementById('detailBio');
    if (p.bio && p.bio.trim()) {
      bioSection.style.display = 'block';
      bioEl.textContent = p.bio;
    } else {
      bioSection.style.display = 'none';
    }

    document.getElementById('detailModal').classList.add('active');
  }

  function closeDetail() {
    document.getElementById('detailModal').classList.remove('active');
    currentDetailId = null;
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制：' + text, 'success');
      }).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('已复制：' + text, 'success'); }
    catch (e) { showToast('复制失败', 'error'); }
    document.body.removeChild(ta);
  }

  // 点击遮罩关闭
  var overlays = document.querySelectorAll('.modal-overlay');
  for (var i = 0; i < overlays.length; i++) {
    overlays[i].addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('active');
    });
  }
  // ESC 键关闭所有弹窗
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      var ms = document.querySelectorAll('.modal-overlay.active');
      for (var j = 0; j < ms.length; j++) ms[j].classList.remove('active');
    }
  });

  // ===== 屏保：瓦格纳（5秒无操作自动显示，点击任意位置恢复）=====
  var IDLE_TIMEOUT = 5000; // 5 秒无操作触发
  var idleTimer = null;
  function showScreensaver() {
    var ss = document.getElementById('screensaver');
    if (ss) ss.classList.add('show');
  }
  function hideScreensaver() {
    var ss = document.getElementById('screensaver');
    if (ss) ss.classList.remove('show');
    CURRENT_TEAM = null; // 恢复后回到5个团队按钮首页
    renderView();
    resetIdleTimer();
  }
  function resetIdleTimer() {
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(showScreensaver, IDLE_TIMEOUT);
  }
  // 只有点击/按键/触摸才重置计时（移动鼠标不算操作）
  ['mousedown', 'keydown', 'touchstart'].forEach(function(evt) {
    window.addEventListener(evt, resetIdleTimer, { passive: true });
  });

  // 初始化：加载数据后再渲染
  loadDataFromJson(function(ok) {
    renderView();
    resetIdleTimer(); // 启动屏保倒计时
    if (!ok && getData().length === 0) {
      // 既不能 fetch data.json，本地也空 → 提示用户（file:// 双击打开时常见）
      showToast('提示：请通过启动服务器或部署到网站访问，直接双击可能无法读取数据', '');
    }
  });
</script>
